             中日對照 → 唯一在 sim 裡零存在感、又必須「邊看日文攻略邊查」的資料（靠篩選框才站得住）
           其餘 11 類（老師／學生／社團／進路／行事／授業／排名／道具／挑戰／成就／城鎮）
           對不上這張圖，正確形態就是一條連往 ../db/<slug>/ 的連結：那裡欄位更完整（例如老師
           有 9 欄含五科指導力與給與上下限）、可被搜尋引擎索引，也不必在 modal 裡重做一個
           比較差的資料庫。攻略敘述（金流／教師 CP／二周目結算）歸 ../start|walkthrough|training|endgame/。

           連結一律 target="_blank"，理由是硬的兩條：㈠ undoStack 是純記憶體（最多 60 步），
           同頁跳走等於不可回復地清空整個復原歷史；㈡ scheduleAutosave() 是 400ms debounce
           且沒有 pagehide flush，最後一筆筆劃落在那個窗口內會靜默消失。 */
        const HB_TH = 'class="text-left font-bold text-gray-700 border-b border-gray-300 px-1 py-1 sticky top-0 bg-white"';
        const HB_TD = 'class="border-b border-gray-100 px-1 py-1 align-top"';
        // cols＝要顯示的 db 欄位索引（刻意少於 db 的欄數：日文與地圖標籤在畫布上已有——
        // 調色盤 tooltip 給日文、格子上就印著標籤——但篩選仍比對全部欄位：能被搜到，不必被看到）
        const HB_TABS = [
            { key: 'spots', label: '景點', cols: [0, 2, 3, 4] },
            { key: 'facilities', label: '設施', cols: [0, 3, 2, 4] },
            { key: 'terms', label: '中日對照', cols: [0, 1, 2] }
        ];
        // 被移除的分頁的交接出口：db 的其餘 11 類。三個分頁 ∪ 這張表＝14 類，
        // checks/consistency.js 會斷言沒有任何一類從模擬器到不了。
        const HB_MORE = [
            ['teachers', '🧑‍🏫 老師'], ['students', '🧑‍🎓 學生'], ['clubs', '🎽 社團'],
            ['careers', '🎓 進路'], ['events', '🎪 行事活動'], ['lessons', '📚 特別授業'],
            ['ranks', '🏅 學校排名'], ['items', '🎒 道具'], ['tasks', '📝 挑戰'],
            ['achievements', '🏆 成就'], ['towns', '🗾 城鎮地圖']
        ];
        const HB_GUIDES = [['start', '開局指南'], ['walkthrough', '全流程'], ['training', '育成'], ['endgame', '終盤']];

        function hbCat(key) {
            const db = window.GAME_DB;
            if (!db || !Array.isArray(db.categories)) return null;
            return db.categories.find(c => c.key === key) || null;
        }

        // 景點列的畫布狀態（nearMap 的 key 就是缺的設施名，與側欄「差一項」同一份來源）
        function hbSpotState(name) {
            const s = SPOTS.find(x => x.name === name);
            if (!s) return '<span class="text-gray-400">—</span>';
            if (lastSpotStats.activeIds.has(s.id)) return '<span class="text-green-600 font-bold">已成立 ✔</span>';
            const near = lastSpotStats.nearMap.get(s.id);
            if (near) return `<span class="text-sky-600">差一項：缺 ${esc([...near.keys()].join(' 或 '))}</span>`;
            return '<span class="text-gray-400">—</span>';
        }
        // 設施列的畫布狀態（countBuilt 已處理多格建築的棟別，不會把 2×2 算成 4 棟）
        function hbFacState(name) {
            const id = Object.keys(items).find(k => items[k].name === name);
            if (!id) return '<span class="text-gray-400">—</span>';
            const n = countBuilt(id);
            return n ? `<span class="text-green-600 font-bold">已建 ${n}</span>` : '<span class="text-gray-400">未建</span>';
        }
        // 「2×1（橫）」這種帶方向註記的尺寸也吃得下；排序鍵＝面積為主、寬度為輔
        function hbSizeKey(s) {
            const m = /(\d+)×(\d+)/.exec(String(s));
            return m ? (+m[1]) * (+m[2]) * 10 + (+m[1]) : 999;
        }

        /* 景點分頁頂端的門檻條：模擬器的頭條數字是 N/29，而它的分母其實是升級門檻
           （有望 1／超大型 3／名門 6／常春藤 16）。盯著 24/29 卻不知道 16 就已經到頂，
           是資訊層級錯置，所以 ranks 不給一個分頁（只有 6 列），而是壓在景點表上方。 */
        function hbRankStrip() {
            const c = hbCat('ranks');
            if (!c) return '';
            const need = r => (parseInt(r[3], 10) || 0);
            const have = lastSpotStats.activeIds.size;
            const next = c.rows.find(r => have < need(r));
            const reached = c.rows.filter(r => have >= need(r));
            const chips = c.rows.map(r => {
                const n = need(r);
                const cls = (r === next) ? 'bg-yellow-50 border-yellow-200' : 'bg-white border-gray-200';
                return `<span class="inline-flex items-center gap-1 border rounded px-1.5 py-0.5 whitespace-nowrap ${cls}">${esc(r[0])}`
                    + `<span class="${have >= n ? 'text-green-600' : 'text-gray-400'}">${n ? n + ' 種' : '無門檻'}</span></span>`;
            }).join('');
            const last = reached.length ? reached[reached.length - 1][0] : c.rows[0][0];
            const tail = next ? `下一關「${esc(next[0])}」需 ${need(next)} 種` : '景點門檻已全部達成';
            return `<div class="mb-2"><div class="text-gray-500 mb-1">目前成立 <b class="text-gray-800">${have}／${SPOTS.length}</b> 種`
                + ` · 已過「${esc(last)}」的景點門檻 · ${tail}（學生數／年數／平均分要對照學校排名表）</div>`
                + `<div class="flex flex-wrap gap-1">${chips}</div></div>`;
        }

        // modal 底部的固定出口。只說一次「新視窗開啟」，不逐條標；也不寫「不會影響你的地圖」——
        // 為了安撫而先讓人想到危險，比不提更糟。
        function hbMoreHtml() {
            const chips = HB_MORE.map(([slug, label]) =>
                `<a class="hb-out inline-flex items-center gap-1 bg-white border border-gray-200 rounded px-1.5 py-1 whitespace-nowrap hover:bg-gray-100 transition" data-out="db/${slug}" href="../db/${slug}/" target="_blank" rel="noopener">${label}</a>`
            ).join('');
            const guides = HB_GUIDES.map(([slug, label]) =>
                `<a class="hb-out font-bold text-sky-600 hover:text-sky-900" data-out="${slug}" href="../${slug}/" target="_blank" rel="noopener">${label}</a>`
            ).join(' · ');
            return `<div class="border-t border-gray-200 mt-3 pt-2">`
                + `<div class="font-bold text-gray-700 mb-1">完整資料表在資料庫（新視窗開啟 ↗）</div>`
                + `<div class="flex flex-wrap gap-1">${chips}</div>`
                + `<div class="text-gray-500 mt-1.5">想看攻略文字：${guides}</div></div>`;
        }

        /* 篩選只切換 <tr> 的 display（照 filterPalette() 的慣例），**絕不重繪 innerHTML**：
           重繪會把輸入框自己砍掉重建 → 焦點掉到 body、游標歸零，中文 IME 的組字更會在每個
           按鍵被中斷（注音打「教室」會直接壞掉）。而 check.js 只做 new Function 語法檢查，
           這個 bug 不會被任何檢查器抓到，所以寫在這裡。 */
        function hbFilter(q) {
            const wrap = document.getElementById('hbTable');
            if (!wrap) return;
            const needle = q.trim().toLowerCase();
            const rows = wrap.querySelectorAll('tr[data-hbq]');
            let n = 0;
            rows.forEach(tr => {
                const hit = !needle || tr.dataset.hbq.indexOf(needle) >= 0;
                tr.style.display = hit ? '' : 'none';
                if (hit) n++;
            });
            const cnt = document.getElementById('hbCount');
            if (cnt) cnt.textContent = needle ? `符合 ${n} 項／共 ${rows.length} 項` : `共 ${rows.length} 項`;
            const empty = document.getElementById('hbEmpty');
            if (empty) empty.style.display = (needle && !n) ? '' : 'none';
        }

        function buildHandbook(section, isSwitch) {
            const tab = HB_TABS.find(t => t.key === section) || HB_TABS[0];
            section = tab.key;
            track(isSwitch ? 'handbook_tab' : 'open_handbook', { section });
            // 3 顆等寬按鈕＝真的分頁控件（≥44px 高，不再是 20px 的小晶片）
            const nav = `<div role="tablist" class="flex gap-1 mb-3">` + HB_TABS.map(t =>
                `<button id="hbTab-${t.key}" role="tab" aria-selected="${t.key === section}" class="hb-tab flex-1 px-3 py-3 rounded-lg border text-xs font-bold transition ${t.key === section ? 'bg-indigo-600 text-white' : 'bg-white text-gray-700 border-gray-200 hover:bg-gray-100'}" data-hb="${t.key}">${t.label}</button>`
            ).join('') + `</div>`;

            const c = hbCat(section);
            let body;
            if (!c || !c.rows || !c.rows.length) {
                // 靜默失效是最糟的失效模式（使用者只會覺得「速查表壞了」，不會回報）→ 明講並給出口
                body = `<div class="text-gray-500 py-3">讀不到資料庫（<b class="text-gray-700">db/data.js</b> 沒載入，或分類「${esc(section)}」不在正本裡）。`
                    + `<a class="hb-out font-bold text-sky-600 hover:text-sky-900" data-out="db/${section}" href="../db/${section}/" target="_blank" rel="noopener">在資料庫開啟這張表 ↗</a></div>`;
            } else {
                const stateCol = section === 'spots' ? '這張圖' : (section === 'facilities' ? '這張圖' : '');
                const order = c.rows.map((r, i) => ({ r, i }));
                if (section === 'facilities') order.sort((a, b) => hbSizeKey(a.r[3]) - hbSizeKey(b.r[3]) || a.i - b.i);
                /* 第一欄（名稱）不准折行：自動表格版面會把它壓到最窄，於是連「運動」
                   「約會」這種兩字景點都被拆成上下兩行，整張表看起來像壞掉。名稱欄
                   最長也只有五個字，nowrap 的代價遠小於可讀性。 */
                const nw = (i) => i === 0 ? HB_TH.replace('class="', 'class="whitespace-nowrap ') : HB_TH;
                const nwd = (i) => i === 0 ? HB_TD.replace('class="', 'class="whitespace-nowrap ') : HB_TD;
                const head = tab.cols.map((j, i) => `<th ${nw(i)}>${esc(c.columns[j])}</th>`).join('')
                    + (stateCol ? `<th ${HB_TH}>${stateCol}</th>` : '');
                const trs = order.map(({ r }) => {
                    const nm = section === 'facilities' ? String(r[0]).replace(/^\S+\s/, '') : r[0];
                    const st = section === 'spots' ? hbSpotState(nm) : (section === 'facilities' ? hbFacState(nm) : '');
                    return `<tr data-hbq="${esc(r.join(' ').toLowerCase())}">`
                        + tab.cols.map((j, i) => `<td ${nwd(i)}>${esc(r[j] || '—')}</td>`).join('')
                        + (stateCol ? `<td ${HB_TD}>${st}</td>` : '') + `</tr>`;
                }).join('');
                /* 表格自捲、外殼不捲：#reportModal 的面板是 max-h-[85vh] overflow-y-auto，
                   而關閉鈕是 absolute top-3 —— 面板一捲，✕ 就跟著捲走，而觸控沒有 Esc。
                   把表格關進自己的捲動框，分頁／篩選／✕／底部連結就永遠在視野內；
                   sticky 表頭也才真的生效。max/min 是為了讓短視窗也留得住表格高度。 */
                body = `<div class="text-gray-400 mb-2">${esc(String(c.intro).split('。')[0])}。</div>`
                    + (section === 'spots' ? hbRankStrip() : '')
                    + `<div class="relative mb-1"><input id="hbFilter" type="text" placeholder="🔍 篩選這張表（也可以打日文）" class="w-full text-xs border border-gray-300 rounded-lg pl-2.5 pr-7 py-2 outline-none focus:border-blue-400 bg-gray-50 focus:bg-white transition">`
                    + `<button id="hbClearBtn" class="absolute right-1.5 top-1/2 -translate-y-1/2 w-4 h-4 flex items-center justify-center text-gray-400 hover:text-gray-700 text-xs font-bold" title="清除篩選">✕</button></div>`
                    + `<div id="hbCount" class="text-gray-400 mb-1" aria-live="polite">共 ${c.rows.length} 項</div>`
                    + `<div id="hbTable" class="overflow-auto" style="max-height:max(8rem, min(52vh, calc(85vh - 21rem)))"><table class="w-full"><thead><tr>${head}</tr></thead><tbody>${trs}</tbody></table></div>`
                    + `<div id="hbEmpty" class="text-gray-500 py-3" style="display:none">找不到符合的項目。試試日文名稱，或到資料庫查完整欄位（下方連結）。</div>`;
            }

            openReport('📖 速查表', nav + body + hbMoreHtml());
            // 換分頁時捲軸要歸零（只在速查表做，不動另外兩支共用者的行為）
            const panel = document.getElementById('reportBody').parentElement;
            if (panel) panel.scrollTop = 0;
            // openReport 把焦點放在關閉鈕（那個契約是對的）；但「切分頁」的焦點該留在剛按的那顆
            if (isSwitch) document.getElementById('hbTab-' + section)?.focus();
        }

        // 把任意地圖資料畫到 canvas（axis=0 表示不畫座標軸；diffSet 內的格子加紅框）
        function drawMapToCanvas(ctx, grid, cell, axis, diffSet) {
            const W = axis * 2 + gridCols * cell, H = axis * 2 + gridRows * cell;
            ctx.fillStyle = '#f3f4f6';
            ctx.fillRect(0, 0, W, H);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            if (axis > 0) {
                ctx.fillStyle = '#4b5563';
                ctx.font = 'bold 10px sans-serif';
                for (let c = 0; c < gridCols; c++) {
                    const x = axis + c * cell + cell / 2;
                    ctx.fillText(gridCols + 1 - c, x, axis / 2);
                    ctx.fillText(gridCols + 1 - c, x, H - axis / 2);
                }
                for (let r = 0; r < gridRows; r++) {
                    const y = axis + r * cell + cell / 2;
                    ctx.fillText(r + 2, axis / 2, y);
                    ctx.fillText(r + 2, W - axis / 2, y);
                }
            }
            const labelFont = 'bold ' + Math.max(8, Math.floor(cell * 0.46)) + 'px sans-serif';
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    const cellData = (grid[r] && grid[r][c]) || { type: 'empty', elevation: 1 };
                    const item = items[cellData.type] || items['empty'];
                    const x = axis + c * cell, y = axis + r * cell;
                    ctx.fillStyle = cellData.type === 'empty' ? '#bbf7d0' : item.color;
                    ctx.fillRect(x, y, cell - 1, cell - 1);
                    if (cellData.elevation >= 2) {
                        ctx.strokeStyle = cellData.elevation === 3 ? '#7c2d12' : '#b45309';
                        ctx.lineWidth = cell >= 20 ? 2 : 1;
                        ctx.strokeRect(x + 1.5, y + 1.5, cell - 4, cell - 4);
                    }
                    if (cell >= 10) {
                        if (cellData.type === 'empty' && isSlopeIn(grid, r, c)) {
                            ctx.fillStyle = '#92400e';
                            ctx.font = labelFont;
                            ctx.fillText('坡', x + cell / 2, y + cell / 2);
                        }
                        if (cellData.type !== 'empty') {
                            const corner = !(sameBlockIn(grid, r, c, r - 1, c) || sameBlockIn(grid, r, c, r, c - 1));
                            if (corner) {
                                ctx.fillStyle = item.textCol || 'black';
                                ctx.font = labelFont;
                                ctx.fillText(item.short, x + cell / 2, y + cell / 2);
                            }
                        }
                    }
                    if (diffSet && diffSet.has(r + ',' + c)) {
                        ctx.strokeStyle = '#dc2626';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(x + 0.5, y + 0.5, cell - 2, cell - 2);
                    }
                }
            }
        }

        // 將目前地圖畫成 PNG 下載（俯視圖）
        function exportImage() {
            const cell = 26, axis = 20;
            const cv = document.createElement('canvas');
            cv.width = axis * 2 + gridCols * cell;
            cv.height = axis * 2 + gridRows * cell;
            drawMapToCanvas(cv.getContext('2d'), gridData, cell, axis);
            const a = document.createElement('a');
            const name = document.getElementById('saveName').value.trim() || 'pa2_map';
            a.download = `${name}.png`;
            a.href = cv.toDataURL('image/png');
            a.click();
            showSysMsg('已下載地圖圖片');
        }

        // ─── 存檔比較 ───
        /* 🆚 比較 同時是「來源徽章的詳情」。
           刻意**不**另開一個「來源說明」modal：這裡本來就在回答「跟什麼比、差幾格」，
           同一條差異規則（type 或 elevation 任一不同即一格）也早就寫在下面的迴圈裡。
           再做第二個，站上就會有兩套「跟什麼比」的詞彙。 */
        function buildCompare() {
            let maps = {};
            try { maps = JSON.parse(localStorage.getItem('pa2_maps_v9')) || {}; } catch (e) {}
            const hasOrigin = originComparable();
            const opts = ['__current__', ...(hasOrigin ? ['__origin__'] : []), ...Object.keys(maps)];
            const label = k => k === '__current__' ? '目前地圖'
                : (k === '__origin__' ? `原始（${origin.name}）` : k);
            const optHtml = sel => opts.map(k =>
                `<option value="${k}" ${k === sel ? 'selected' : ''}>${esc(label(k))}</option>`).join('');

            // 來歷一句話：哪裡來的、什麼時候載入的（時間格式與讀取面板一致）
            let head;
            if (!origin) {
                head = `<div class="mb-2 text-gray-500">這張圖的<b class="text-gray-800">來源不明</b>，可能是上次未儲存的編輯。`
                    + `<button id="cmpAdopt" class="ml-1 font-bold text-sky-700">把現在這張設為比較基準</button></div>`;
            } else {
                const d = new Date(origin.ts || Date.now());
                const when = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
                /* 最重要的差異不是格數，是**結果**的差：載入當下的成果一起記進 origin，
                   所以這裡答得出「範例 29 個、我現在 26 個，少了哪三個」。 */
                let res = '';
                if (origin.spots) {
                    const now = lastSpotStats.activeIds;
                    const lost = origin.spots.filter(id => !now.has(id));
                    const got = [...now].filter(id => !origin.spots.includes(id));
                    const nm = ids => SPOTS.filter(s => ids.includes(s.id)).map(s => s.name).join('、');
                    res = `<br>景點：原始 ${origin.spots.length} 個 → 現在 ${now.size} 個`
                        + (lost.length ? `<br><b class="text-gray-800">少了：${esc(nm(lost))}</b>` : '')
                        + (got.length ? `<br>多了：${esc(nm(got))}` : '')
                        + (origin.blocked !== undefined && lastBlockedCount > origin.blocked
                            ? `<br><b class="text-gray-800">走不到的建築：原始 ${origin.blocked} 棟 → 現在 ${lastBlockedCount} 棟</b>` : '');
                }
                head = `<div class="mb-2 text-gray-500">來源：<b class="text-gray-800">${esc(origin.name)}</b>`
                    + (origin.from ? `（${esc(origin.from)}）` : '') + ` · ${when} 載入`
                    + (hasOrigin ? res : (originGrid ? `<br><b class="text-gray-800">畫布已改成 ${gridRows}×${gridCols}</b>，無法逐格比對。`
                        : '<br>只剩來歷記錄，<b class="text-gray-800">原始內容已遺失</b>，無法逐格比對。'))
                    + '</div>';
            }
            openReport('🆚 地圖比較', head + `
                <div class="flex gap-2 mb-2 items-center text-xs">
                    <select id="cmpA" class="border border-gray-300 rounded p-1 flex-1">${optHtml(hasOrigin ? '__origin__' : '__current__')}</select>
                    <span class="text-gray-400 font-bold">vs</span>
                    <select id="cmpB" class="border border-gray-300 rounded p-1 flex-1">${optHtml(hasOrigin ? '__current__' : (opts[1] || '__current__'))}</select>
                </div>
                <div class="flex gap-3 justify-center mb-2 flex-wrap">
                    <canvas id="cmpCanvasA" class="border border-gray-200 rounded"></canvas>
                    <canvas id="cmpCanvasB" class="border border-gray-200 rounded"></canvas>
                </div>
                <div id="cmpSummary" class="text-xs text-gray-600"></div>`
                + (hasOrigin ? `<div class="mt-3 pt-2 border-t border-gray-200">
                    <button id="cmpRestore" class="text-[11px] font-bold bg-white border border-gray-300 text-gray-700 rounded px-2.5 py-1.5 hover:bg-gray-100 transition">↩ 回到原始狀態</button>
                    <span class="text-[10px] text-gray-400 ml-1.5">會換掉目前的畫布（可 Ctrl+Z 還原）</span>
                </div>` : ''));
            const getGrid = k => {
                if (k === '__current__') return gridData;
                if (k === '__origin__') return originGrid;
                const e = maps[k];
                return Array.isArray(e) ? e : (e && e.data);
            };
            const restore = document.getElementById('cmpRestore');
            if (restore) restore.addEventListener('click', () => { closeReport(); restoreOrigin(); });
            const adopt = document.getElementById('cmpAdopt');
            if (adopt) adopt.addEventListener('click', () => {
                // 舊使用者（沒有 origin）的唯一出路：把現況立成基準，之後才有東西可比。
                // 這個動作不動畫布，所以不必進 guardDestructive。
                setOrigin({ kind: 'save', name: '你設的基準', from: '從目前的畫布立起', town: currentTownKey });
                closeReport();
                showSysMsg('已把目前的地圖設為比較基準');
            });
            const render = () => {
                const gA = getGrid(document.getElementById('cmpA').value);
                const gB = getGrid(document.getElementById('cmpB').value);
                if (!gA || !gB) return;
                const diff = new Set();
                const delta = {};
                let elevOnly = 0;
                for (let r = 0; r < gridRows; r++) {
                    for (let c = 0; c < gridCols; c++) {
                        const a = (gA[r] && gA[r][c]) || { type: 'empty', elevation: 1 };
                        const b = (gB[r] && gB[r][c]) || { type: 'empty', elevation: 1 };
                        if (a.type !== b.type || (a.elevation || 1) !== (b.elevation || 1)) {
                            diff.add(r + ',' + c);
                            if (a.type === b.type) elevOnly++;
                            if (a.type !== b.type) {
                                if (a.type !== 'empty') delta[a.type] = (delta[a.type] || 0) - 1;
                                if (b.type !== 'empty') delta[b.type] = (delta[b.type] || 0) + 1;
                            }
                        }
                    }
                }
                const cell = 11;
                [[gA, 'cmpCanvasA'], [gB, 'cmpCanvasB']].forEach(([g, id]) => {
                    const cv = document.getElementById(id);
                    cv.width = gridCols * cell;
                    cv.height = gridRows * cell;
                    drawMapToCanvas(cv.getContext('2d'), g, cell, 0, diff);
                });
                const deltaTxt = Object.entries(delta)
                    .map(([t, n]) => `${items[t] ? items[t].name : t} ${n > 0 ? '+' : ''}${n}`).join('、');
                document.getElementById('cmpSummary').innerHTML =
                    `<b>差異：${diff.size} 格</b>${diff.size ? '（紅框標示）' : '，兩張地圖相同'}` +
                    (deltaTxt ? `<br>左→右格數變化：${deltaTxt}` : '') +
                    /* 誠實補兩句：高度也算一格差異（它會改寫斜坡與可達性，藏起來才是說謊）；
                       但改一格高度會讓鄰格的斜坡跟著變，那些鄰格的儲存值沒變、不會被標成差異。 */
                    (elevOnly ? `<br><span class="text-gray-400">其中 ${elevOnly} 格只改了高度（鄰格自動生成的斜坡會跟著變，但那些格子本身不算差異）</span>` : '');
            };
            document.getElementById('cmpA').addEventListener('change', render);
            document.getElementById('cmpB').addEventListener('change', render);
            render();
        }

        /* ─── 右軌常駐摘要（不可折疊）───
           分層：進度永遠在（約一行）；「差一項」與「走不到」只有 >0 時才存在。
           所以地圖乾淨時這塊幾乎不佔高度，有事做時才長高 —— 優先權由狀態決定，不由版位決定。
           已成立的 29 個名稱徽章是參考資料不是行動 → 退到「明細」（點 24/29 開）。 */
        const NEAR_CAP = 6;
        let nearExpanded = false;
        function renderSpotStats(activeIds, nearMap) {
            const cnt = document.getElementById('spotCount');
            if (!cnt) return;
            const act = SPOTS.filter(s => activeIds.has(s.id));
            const nears = SPOTS.filter(s => !activeIds.has(s.id) && nearMap.has(s.id));
            cnt.innerText = act.length;
            document.getElementById('spotProg').style.width =
                Math.round(act.length / SPOTS.length * 100) + '%';

            const wrap = document.getElementById('nearWrap'), chips = document.getElementById('nearChips');
            if (!nears.length) {
                wrap.classList.add('hidden');
                chips.innerHTML = '';
            } else {
                wrap.classList.remove('hidden');
                const shown = nearExpanded ? nears : nears.slice(0, NEAR_CAP);
                chips.innerHTML = shown.map(s => {
                    const entries = [...nearMap.get(s.id).entries()];
                    const [nm, id] = entries[0];
                    const all = entries.map(e => e[0]).join(' 或 ');
                    return `<button class="near-chip inline-flex items-center gap-1 px-2 py-1 rounded border border-gray-200 bg-white hover:bg-gray-100 text-[11px]" data-tool="${id}" title="${esc(s.name)}：缺 ${esc(all)}（點一下亮出可放置位置）"><b class="text-gray-800">${s.name}</b><span class="font-bold text-sky-700">缺 ${esc(nm)}</span></button>`;
                }).join('') + (nears.length > NEAR_CAP
                    ? `<button id="nearMoreBtn" class="text-[11px] font-bold text-gray-500 px-1.5 py-1">${nearExpanded ? '收起' : '還有 ' + (nears.length - NEAR_CAP) + ' 項 ›'}</button>`
                    : '');
            }

            /* 走不到是**錯誤**，不是進度，所以自己一行、不跟 24/29 搶。
               沒有校門時要說「無法檢查」——把「沒檢查」講成「0 棟走不到」是把沒問題說謊。 */
            const bb = document.getElementById('blockedBtn');
            if (!lastHasGate && lastBuildingGroups > 0) {
                bb.classList.remove('hidden');
                bb.innerText = '⚠ 未設校門，無法檢查動線';
            } else if (lastBlockedCount) {
                bb.classList.remove('hidden');
                bb.innerText = `⚠ ${lastBlockedCount} 棟走不到（點看動線）`;
            } else {
                bb.classList.add('hidden');
            }
        }

        /* 景點明細：點「24/29」那個數字本身打開。
           成立清單＋屬性加成合計＋使用格數（原「📋 佈局體檢」獨有的那些）都在這裡——
           讓那個數字成為它自己的詳情入口，比多一顆按鈕更短。 */
        function buildSpotDetail() {
            const { activeIds, nearMap } = lastSpotStats;
            const act = SPOTS.filter(s => activeIds.has(s.id));
            const totals = {};
            act.forEach(s => {
                for (const m of s.bonus.matchAll(/(\S+?)\+(\d+)/g)) {
                    totals[m[1]] = (totals[m[1]] || 0) + Number(m[2]);
                }
            });
            let builtCells = 0;
            const typeSet = new Set();
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    const t = gridData[r][c].type;
                    if (t !== 'empty') { builtCells++; if (isBuildingType(t)) typeSet.add(t); }
                }
            }
            let html = `<div class="mb-2"><b class="text-gray-800">成立景點：${act.length}／29 種</b>`;
            html += act.length
                ? '<div class="flex flex-wrap gap-1 mt-1.5">' + act.map(s =>
                    `<span class="inline-flex items-center gap-1 bg-white border border-gray-200 rounded px-1.5 py-0.5 whitespace-nowrap" title="${esc(s.bonus)}${s.teacher ? '／可招募：' + esc(s.teacher) : ''}"><span class="w-2 h-2 rounded-full ${s.dotColor} inline-block"></span>${s.name}<span class="text-gray-400">${s.bonus}</span></span>`
                ).join('') + '</div>'
                : '<div class="text-gray-400 mt-1">（尚無）</div>';
            html += '</div>';
            const tKeys = Object.keys(totals);
            html += `<div class="mb-2"><b class="text-gray-800">屬性加成合計：</b>${tKeys.length ? tKeys.map(k => `${k}+${totals[k]}`).join('、') : '（尚無）'}</div>`;
            const nears = SPOTS.filter(s => !activeIds.has(s.id) && nearMap.has(s.id));
            if (nears.length) {
                html += '<div class="mb-2"><b class="text-gray-800">差一項就成立：</b><br>' +
                    nears.map(s => `・${s.name}：缺 ${[...nearMap.get(s.id).keys()].join(' 或 ')}`).join('<br>') + '</div>';
            }
            html += `<div class="mb-2"><b class="text-gray-800">畫布：</b>${townLabel()}，已使用 ${builtCells}／${gridRows * gridCols} 格，設施 ${typeSet.size} 種。</div>`;
            html += `<div><b class="text-gray-800">動線：</b>${!lastHasGate ? '未設校門，無法檢查' : (lastBlockedCount ? `⚠ 有 ${lastBlockedCount} 棟設施被完全包圍（紅框），學生無法進入` : '所有設施都有出入口 ✔')}</div>`;
            openReport('📊 景點明細', html);
        }

        function getFootprint(id) {
            const it = items[id] || items['empty'];
            return { w: it.w || 1, h: it.h || 1 };
        }

        function canPlaceAllEmpty(r, c, w, h) {
            if (r + h > gridRows || c + w > gridCols) return false;
            for (let dr = 0; dr < h; dr++) {
                for (let dc = 0; dc < w; dc++) {
                    if (gridData[r + dr][c + dc].type !== 'empty') return false;
                }
            }
            return true;
        }

        /* 放置前清掉 footprint 底下的既有建築。
           只處理帶 bid 的多格建築：直接覆蓋多格建築會留下保有舊 type 的「殘格」，
           checkSpots() 分不出殘格與完整建築，景點數會靜默算錯（24/29 可能建立在半棟餐廳上）。
           1×1 的格子被整格覆蓋不會產生殘格，無需拆除也不必提示（否則拖曳畫地形會一路跳 toast）。
           回傳 null 表示什麼都沒拆；否則 { cells, label } 供重繪與提示使用。
           pushHistory() 已在筆劃開始時記錄，誤拆可 Ctrl+Z 還原。 */
        function razeUnder(r, c, w, h) {
            const cells = [], counts = new Map();
            for (let dr = 0; dr < h; dr++) {
                for (let dc = 0; dc < w; dc++) {
                    const cell = gridData[r + dr][c + dc];
                    if (cell.type === 'empty' || cell.bid === undefined) continue;
                    const bid = cell.bid;
                    const nm = (items[cell.type] && items[cell.type].name) || cell.type;
                    counts.set(nm, (counts.get(nm) || 0) + 1);
                    for (let rr = 0; rr < gridRows; rr++) {
                        for (let cc = 0; cc < gridCols; cc++) {
                            if (gridData[rr][cc].bid !== bid) continue;
                            gridData[rr][cc] = { type: 'empty', elevation: gridData[rr][cc].elevation };
                            cells.push([rr, cc]);
                        }
                    }
                }
            }
            if (!cells.length) return null;
            const label = [...counts.entries()].map(([nm, n]) => n > 1 ? `${nm}×${n}` : nm).join('、');
            return { cells, label };
        }

        function applyTool(r, c) {
            if (!window._paintedOnce) { window._paintedOnce = true; track('first_paint'); }
            // 清除模式點到多格建築 → 整棟拆除
            if (currentTool === 'empty' && gridData[r][c].bid !== undefined) {
                const bid = gridData[r][c].bid;
                for (let rr = 0; rr < gridRows; rr++) {
                    for (let cc = 0; cc < gridCols; cc++) {
                        if (gridData[rr][cc].bid === bid) {
                            gridData[rr][cc] = { type: 'empty', elevation: gridData[rr][cc].elevation };
                            updateTileVisuals(rr, cc);
                        }
                    }
                }
                scheduleCheckSpots();
                updateCoordHint(r, c);
                return;
            }
            const fp = getFootprint(currentTool);
            if (r + fp.h > gridRows || c + fp.w > gridCols) {
                showSysMsg(`超出地圖範圍，${items[currentTool].name} 需要 ${fp.w}×${fp.h} 的空間`, true);
                return;
            }
            // 乾淨覆蓋：壓到既有多格建築時整棟拆除，絕不留下殘格
            // （殘格會保留舊 type，checkSpots() 仍把半棟建築當有效材料 → 景點數會算錯）
            const razed = razeUnder(r, c, fp.w, fp.h);
            const bid = fp.w * fp.h > 1 ? ++blockIdCounter : undefined;
            for (let dr = 0; dr < fp.h; dr++) {
                for (let dc = 0; dc < fp.w; dc++) {
                    const cell = { type: currentTool, elevation: currentElevation };
                    if (bid) cell.bid = bid;
                    gridData[r + dr][c + dc] = cell;
                }
            }
            // 連同周圍一圈重繪：合併縫隙與鄰格的標籤顯示會受影響
            for (let dr = -1; dr <= fp.h; dr++) {
                for (let dc = -1; dc <= fp.w; dc++) {
                    const nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < gridRows && nc >= 0 && nc < gridCols) updateTileVisuals(nr, nc);
                }
            }
            // 被拆掉那幾棟的其餘格子可能落在 footprint 之外，同樣要連周圍一圈重繪
            if (razed) {
                for (const [rr, cc] of razed.cells) {
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            const nr = rr + dr, nc = cc + dc;
                            if (nr >= 0 && nr < gridRows && nc >= 0 && nc < gridCols) updateTileVisuals(nr, nc);
                        }
                    }
                }
                showSysMsg(`已拆除 ${razed.label} 以放置 ${items[currentTool].name}`);
            }
            scheduleCheckSpots();
            updateCoordHint(r, c);
        }

        /* 拖曳作畫的順暢度：checkSpots() 要掃 (rows-3)×(cols-3) 個 4×4 窗口 × 29 個景點，
           再跑可達性 BFS、景點指示、建議框——一次約 25 萬次運算。原本「每畫一格」就跑一次，
           拖過 20 格就是 20 倍，這是主要的卡頓來源。改成：拖曳中只更新該格的視覺（很輕），
           放手時再算一次總帳。單點放置照舊即時算，感受不變。 */
        let heavyPending = false;
        function scheduleCheckSpots() {
            if (isDrawing) { heavyPending = true; return; }
            heavyPending = false;
            checkSpots();
        }
        function flushCheckSpots() {
            if (!heavyPending) return;
            heavyPending = false;
            checkSpots();
        }

        // 城鎮預設圖：健康鎮開局時的原始地形
        const PRESET_DEFAULT_DATA = `[[{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":2},{"type":"empty","elevation":2},{"type":"empty","elevation":2},{"type":"empty","elevation":2},{"type":"empty","elevation":2},{"type":"empty","elevation":2},{"type":"empty","elevation":2},{"type":"empty","elevation":2},{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":1}],[{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":2},{"type":"empty","elevation":2},{"type":"empty","elevation":2},{"type":"empty","elevation":2},{"type":"empty","elevation":2},{"type":"empty","elevation":2},{"type":"empty","elevation":2},{"type":"empty","elevation":2},{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"woods","elevation":1},{"type":"woods","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":1}],[{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":2},{"type":"empty","elevation":2},{"type":"empty","elevation":2},{"type":"empty","elevation":2},{"type":"empty","elevation":2},{"type":"empty","elevation":2},{"type":"woods","elevation":1},{"type":"woods","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"type":"empty","elevation":1},{"ty         const PRESETS = {
            health: { name: '健康鎮', desc: '比例優良的標準地區', rows: 26, cols: 24, data: PRESET_DEFAULT_DATA },
            winter: { name: '冬郵小鎮', desc: '東京西邊的普通盆地（ヒガシクメールタウン）', rows: 26, cols: 26, data: PRESET_EAST_DATA },
            lake:   { name: '湖岸小鎮', desc: '被湖泊環繞的美麗地區', rows: 24, cols: 24, data: PRESET_LAKE_DATA },
            valley: { name: '溪谷小鎮', desc: '位於山區的峭壁地區', rows: 26, cols: 26, data: PRESET_VALLEY_DATA },
            hill:   { name: '百靈山丘', desc: '位於市中心有許多有錢人，開局資金多 40 萬', rows: 26, cols: 26, data: PRESET_HILL_DATA }
        };

        // opts.quiet：啟動時「先還原 autosave／預設圖、再套用分享碼」的第一步不必吐 toast
        // （否則從佈局頁點進來會連著看到兩句「已載入…」）。
        function loadPreset(key, opts) {
            const quiet = !!(opts && opts.quiet);
            const preset = PRESETS[key];
            if (!preset) return;
            if (!preset.data) {
                // 尚無地形資料 → 以該城鎮的正確尺寸開空白畫布，方便照著遊戲畫
                pushHistory();
                setGridSize(preset.rows || 26, preset.cols || 24, false);
                importGridData(gridData.map(row => row.map(() => ({ type: 'empty', elevation: 1 }))));
                document.getElementById('saveName').value = preset.name;
                track('load_preset_blank', { preset: key });
                setOrigin({ kind: 'blank', name: `空白畫布 ${gridRows}×${gridCols}`, from: preset.name, town: key });
                showSysMsg(`「${preset.name}」尚無地形資料，已開啟 ${preset.rows}×${preset.cols} 空白畫布`);
                return;
            }
            try {
                const parsed = JSON.parse(preset.data);
                pushHistory();
                if (importGridData(parsed)) {
                    track('load_preset', { preset: key });
                    document.getElementById('saveName').value = preset.name;
                    markClean(key);
                    setOrigin({ kind: 'preset', name: preset.name, from: '遊戲開局地形', town: key });
                    if (quiet) return;
                    showSysMsg(`已載入：${preset.name}`);
                } else {
                    showSysMsg('預設圖格式錯誤', true);
                }
            } catch (e) { showSysMsg('預設圖解析失敗', true); }
        }
