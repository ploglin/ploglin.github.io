           baseline＝最近一次明確落地（載入地形／讀取存檔／貼上載入／儲存成功／使用者選了直接繼續）
           的內容快照；比對前一律正規化（只留 type＋elevation），因為 importGridData() 之後
           assignBlockIds() 會補上 bid —— 拿原始字面比會變成「剛載入就已經 dirty」，
           對話框每次都跳，使用者三次之後就不再讀它。
           內容比對（而非布林旗標）的好處：Ctrl+Z 回到 baseline 會自然變回乾淨。 */
        let currentTownKey = null;
        let baseline = null;

        function canonGrid(grid) {
            return JSON.stringify((grid || []).map(row => (row || []).map(c =>
                [(c && c.type) || 'empty', (c && c.elevation) || 1])));
        }
        function markClean(townKey) {
            baseline = canonGrid(gridData);
            if (townKey !== undefined) currentTownKey = townKey;
            updateTownLabel();
        }
        function isDirty() { return baseline === null || canonGrid(gridData) !== baseline; }

        // 內容與哪一鎮的原始地形完全相同（還原 autosave／貼上外部代碼時用來認出來歷）
        function matchTown(grid) {
            const rows = (grid || []).length, cols = ((grid || [])[0] || []).length;
            const target = canonGrid(grid);
            return Object.keys(PRESETS).find(k => {
                const p = PRESETS[k];
                if (!p.data || p.rows !== rows || p.cols !== cols) return false;
                try { return canonGrid(JSON.parse(p.data)) === target; } catch (e) { return false; }
            }) || null;
        }

        /* ═══ 來源徽章與差異圖層 ═══════════════════════════════════════════
           要解決的事：從佈局頁點「🧩 在模擬器開啟」載進來之後，畫面上看不出這張圖是誰
           （分享碼載入後 hash 被刻意清掉，自動存檔恢復後更是完全失憶），也沒辦法把
           「現在」跟「載入時」對照。所以：
           ㈠ 來歷在**載入動作發生時**就記下來（不是事後用 matchTown 猜「像哪一鎮」——
              那只認得原始地形，完美佈局蓋滿之後它一定回 null），連原始地形一起存進
              新的 key `pa2_origin_v1`（不塞 prefs：prefs 每次縮放／換筆刷都重寫，
              帶著 3.8KB 的分享碼一起重寫太浪費）。
           ㈡ baseline（dirty 追蹤）與 origin 是**兩件事**：baseline 會被「儲存」推進，
              origin 只跟著載入動作走 —— 存了檔不代表你不再想跟原始範例比。 */
        const ORIGIN_KEY = 'pa2_origin_v1';

        /* 站上 8 組分享碼 → 「這是哪一頁的哪一張」。
           sim 是純前端、讀不到別的檔，所以只能內嵌對照；為了不內嵌 17KB 的完整碼，
           key 是指紋＝「碼長.前 12 字.後 8 字」。
           **腐爛防線**在 scripts/checks/consistency.js：它會掃站上實際的分享碼、算同一個
           指紋，比對這張表（多一筆、少一筆、名稱不在該頁上都報 WARN）。沒有那條檢查，
           下一次重算完美佈局就會讓徽章默默降級成「任意分享碼」而沒有人發現。 */
        function codeFingerprint(code) {
            code = String(code || '');
            return code.length + '.' + code.slice(0, 12) + code.slice(-8);
        }
        const SITE_LAYOUTS = {
            '3286.MC4xLjMsMC4yw3LjEuNA':  { name: '健康鎮完美佈局',   page: 'layouts/health/index.html', from: '完美佈局：健康鎮',   town: 'health' },
            '3852.MjZ4MjY7MTIuMTMuMS4x': { name: '冬郵小鎮完美佈局', page: 'layouts/east/index.html',   from: '完美佈局：冬郵小鎮', town: 'winter' },
            '2747.MjR4MjQ7MTMuxMy4yLjE': { name: '湖岸小鎮完美佈局', page: 'layouts/lake/index.html',   from: '完美佈局：湖岸小鎮', town: 'lake' },
            '3639.MjZ4MjY7Ny4xsMS4xLjE': { name: '溪谷小鎮完美佈局', page: 'layouts/valley/index.html', from: '完美佈局：溪谷小鎮', town: 'valley' },
            '3803.MjZ4MjY7MjcuzNi4xLjE': { name: '百靈山丘完美佈局', page: 'layouts/hill/index.html',   from: '完美佈局：百靈山丘', town: 'hill' },
            // 入門三張是「空白畫布上的幾個設施」，不是任何一鎮的地形 → 不設 town，
            // 城鎮鈕維持誠實的「自訂 26×24」。
            '120.MC4xLjI1MCw1LjEuMzIz': { name: '序盤 CP 值三景點', page: 'layouts/index.html', from: '佈局範例集：入門範例', town: null },
            '112.MC4xLjI1MCwzLjEuMzI0': { name: '樞紐共用：一區三景點', page: 'layouts/index.html', from: '佈局範例集：入門範例', town: null },
            '84.MC4xLjI1MCw0LjEuMzQ2':  { name: '教室學習區', page: 'layouts/index.html', from: '佈局範例集：入門範例', town: null }
        };

        /* origin.kind：site（站上 8 組之一）／share（任意分享碼）／preset（五鎮地形）／
           save（具名存檔）／blank（空白畫布）／null（來源不明：舊使用者、清過 localStorage） */
        let origin = null;
        let originGrid = null;   // 原始地形只解碼一次進記憶體（不要每筆劃 decode 3.8KB）

        function originFromCode(code) {
            const hit = SITE_LAYOUTS[codeFingerprint(code)];
            return hit
                ? { kind: 'site', name: hit.name, from: hit.from, town: hit.town || null }
                : { kind: 'share', name: '分享的地圖', from: '別人（或你自己）給的分享碼', town: null };
        }

        /* 把「現在的畫布」蓋章成 origin。呼叫時機＝載入動作剛完成（importGridData 之後，
           所以 checkSpots 已經跑過，lastSpotStats／lastBlockedCount 就是這張圖的成果）。
           順手記下成果，是因為使用者問「我跟範例差在哪」時，真正想知道的是**結果的差**
           （範例 29 個景點、我現在 26 個），格數只是過程量。 */
        function setOrigin(meta) {
            origin = Object.assign({
                kind: 'blank', name: '空白畫布', from: '', town: null
            }, meta || {}, {
                ts: Date.now(),
                rows: gridRows, cols: gridCols,
                code: encodeMap(),
                spots: [...lastSpotStats.activeIds],
                blocked: lastBlockedCount
            });
            originGrid = decodeMap(origin.code);
            try { localStorage.setItem(ORIGIN_KEY, JSON.stringify(origin)); } catch (e) {}
            // 蓋章的當下一定要重畫圖層：載入途中 checkSpots() 已經拿**舊**的 origin 畫過一次，
            // 只更新文字的話地圖上會留著對照舊來源的色洗。
            renderDiffOverlay();
        }
        function loadOriginStore() {
            try {
                const o = JSON.parse(localStorage.getItem(ORIGIN_KEY));
                if (o && o.code) { origin = o; originGrid = decodeMap(o.code); }
            } catch (e) { origin = null; originGrid = null; }
        }
        // Ctrl+Z 跨過一次載入時 origin 要一起回去，否則徽章會開始說謊
        function adoptOrigin(o) {
            origin = o || null;
            originGrid = (o && o.code) ? decodeMap(o.code) : null;
            try {
                if (o) localStorage.setItem(ORIGIN_KEY, JSON.stringify(o));
                else localStorage.removeItem(ORIGIN_KEY);
            } catch (e) {}
            updateOriginRow();
        }
        // 逐格比對只有在尺寸相同時才有意義（「只換尺寸」保留內容但換了畫布）
        function originComparable() {
            return !!(originGrid && origin && origin.rows === gridRows && origin.cols === gridCols
                && origin.kind !== 'blank');
        }

        /* 三態：add＝原本空／地形變成有設施、del＝原本有設施變成空、chg＝兩邊都有東西
           但種類不同，**或種類相同而高度不同**。把高度算進來與 🆚 比較 的規則一致
           （type 或 elevation 任一不同即一格差異），而且高度會改寫 isSlope() 的衍生結果
           與可達性，藏起來才是說謊 —— 所以狀態叫「改過」而不是「換過」。 */
        function computeDiff() {
            const out = { add: [], del: [], chg: [], elevOnly: 0, mask: null, groups: [] };
            if (!originComparable()) return out;
            const mask = Array(gridRows).fill(null).map(() => Array(gridCols).fill(null));
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    const a = (originGrid[r] && originGrid[r][c]) || { type: 'empty', elevation: 1 };
                    const b = gridData[r][c];
                    const at = a.type, bt = b.type;
                    const ae = a.elevation || 1, be = b.elevation || 1;
                    if (at === bt && ae === be) continue;
                    let kind;
                    if (at === 'empty' && bt !== 'empty') kind = 'add';
                    else if (at !== 'empty' && bt === 'empty') kind = 'del';
                    else { kind = 'chg'; if (at === bt) out.elevOnly++; }
                    mask[r][c] = kind;
                    out[kind].push([r, c]);
                }
            }
            out.mask = mask;
            /* 標號的自然單位不是「一棟」而是「一塊改動區」：重鋪 12 格走廊按棟標號會標 12 個，
               那正是 .found-num 的 NUM_CAP 註解要避免的噪音。改成 4 鄰接連通塊，每塊一個號。 */
            const seen = Array(gridRows).fill(null).map(() => Array(gridCols).fill(false));
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    if (!mask[r][c] || seen[r][c]) continue;
                    const stack = [[r, c]];
                    seen[r][c] = true;
                    let br = r, bc = c;
                    while (stack.length) {
                        const [cr, cc] = stack.pop();
                        if (cr < br || (cr === br && cc < bc)) { br = cr; bc = cc; }
                        [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dr, dc]) => {
                            const nr = cr + dr, nc = cc + dc;
                            if (nr < 0 || nr >= gridRows || nc < 0 || nc >= gridCols) return;
                            if (mask[nr][nc] && !seen[nr][nc]) { seen[nr][nc] = true; stack.push([nr, nc]); }
                        });
                    }
                    out.groups.push({ r: br, c: bc });
                }
            }
            return out;
        }

        /* 差異圖層是不是**正在畫**。定位模式（搜尋／點選設施的聚光燈）會把全圖壓暗，
           與色洗疊起來是泥巴 → 互斥；但互斥**不等於取消**：prefs.diffOn 留著，
           離開定位就自己回來。理由：selectTool() 只要那種設施已經蓋在圖上就會進定位模式，
           「照著範例改」的過程有一半時間在定位模式裡，每次都關掉的話沒人會再開它。 */
        function diffActive() {
            return !!prefs.diffOn && originComparable() && !document.body.classList.contains('locating');
        }
        let diffSpots = [];

        /* 景點視覺的取捨（與定位模式**刻意不同**）：
           定位模式把五個景點通道全部藏掉，因為聚光燈壓暗全圖、兩者搶同一組視覺通道。
           差異圖層不壓暗任何東西，而且使用者改完最想知道的下一件事正是
           「我這 17 格有沒有弄壞景點」——把景點藏起來等於在最需要它的時候拿走答案。
           所以：**保留**黃圈核心格、景點指示點、hover tooltip（都是關於現況的事實）；
           **只關**藍／天藍虛線建議框——它們是「未來的建議」、畫在空格上，而「拆掉」態
           也正好標在空格上，同一格會被兩種相反語意重複標記。 */
        function renderDiffOverlay() {
            document.querySelectorAll('.diff-ov').forEach(n => n.remove());
            document.querySelectorAll('.found-num.dn').forEach(n => n.remove());
            document.body.classList.toggle('diffing', diffActive());
            diffSpots = [];
            if (!diffActive()) { updateOriginRow(); return; }
            const d = computeDiff();
            const MARK = { add: '+', del: '−', chg: '≠' };
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    const kind = d.mask[r][c];
                    if (!kind) continue;
                    const el = tileAt(r, c);
                    if (!el) continue;
                    const ov = document.createElement('div');
                    ov.className = 'diff-ov d-' + (kind === 'add' ? 'add' : kind === 'del' ? 'del' : 'chg');
                    ov.innerHTML = '<i class="diff-mark">' + MARK[kind] + '</i>';
                    el.appendChild(ov);
                }
            }
            // 位置用「地圖上標序號」交代，不列座標（座標是機器格式）。超過上限就不標號，
            // 沿用定位模式那句「已在地圖上全部標亮」。
            const NUM_CAP = 40;
            diffSpots = d.groups;
            if (diffSpots.length <= NUM_CAP) {
                diffSpots.forEach((s, i) => {
                    const el = tileAt(s.r, s.c);
                    if (!el) return;
                    const b = document.createElement('button');
                    b.className = 'found-num dn';
                    b.dataset.i = i;
                    b.textContent = i + 1;
                    b.title = '跳到第 ' + (i + 1) + ' 處變更';
                    el.appendChild(b);
                });
            }
            updateOriginRow(d);
        }

        /* 右軌的兩列文案。第 2 列（差異）＝可點的圖層開關，比照 blockedBtn
           「⚠ N 棟走不到（點看動線）」的句法：狀態讀數本身就是入口，頂列不必多一顆按鈕。
           單位一律用**格**，三個數字相加等於標題數字（不可以一個說格、一個說棟）。 */
        function updateOriginRow(pre) {
            const nameEl = document.getElementById('originName');
            const kindEl = document.getElementById('originKind');
            const btn = document.getElementById('diffBtn');
            if (!nameEl || !kindEl || !btn) return;

            if (!origin) {
                nameEl.innerText = '📄 這張圖的來源不明';
                kindEl.innerText = '可能是上次未儲存的編輯';
            } else {
                nameEl.innerText = '📄 ' + origin.name;
                const KIND_TXT = {
                    site: '站上範例', share: '分享碼', preset: '五鎮預設地形',
                    save: '你的存檔', blank: '從空白開始'
                };
                let sub = KIND_TXT[origin.kind] || '';
                if (origin.from) sub += ' · ' + origin.from;
                if (origin.kind !== 'blank' && !originGrid) sub += '（原始內容已遺失）';
                else if (origin.kind !== 'blank' && (origin.rows !== gridRows || origin.cols !== gridCols)) {
                    sub += `（已改成 ${gridRows}×${gridCols}，無法逐格比對）`;
                }
                kindEl.innerText = sub;
            }

            // 空白畫布／來源不明／尺寸已變 → 沒有可比的基準，這一列不存在
            if (!originComparable()) { btn.classList.add('hidden'); return; }
            const d = pre || computeDiff();
            const n = d.add.length + d.del.length + d.chg.length;
            const on = diffActive();
            const suspended = !!prefs.diffOn && !on;
            btn.classList.toggle('diff-on', on);
            btn.setAttribute('aria-pressed', on ? 'true' : 'false');
            const spotDelta = origin && origin.spots ? lastSpotStats.activeIds.size - origin.spots.length : 0;
            const spotTxt = spotDelta < 0 ? `，比原始少 ${-spotDelta} 個景點`
                : (spotDelta > 0 ? `，比原始多 ${spotDelta} 個景點` : '');

            if (suspended) {
                // 圖層沒有被取消，只是暫停 → 維持可點（點一下清掉定位就回來）
                btn.classList.remove('hidden');
                btn.innerText = `✏ 與原始差 ${n} 格（定位中暫停，點恢復）`;
                return;
            }
            if (!on) {
                if (!n) { btn.classList.add('hidden'); return; }   // 沒差異又沒開圖層＝這一列不必存在
                btn.classList.remove('hidden');
                btn.innerText = `✏ 與原始差 ${n} 格（點看差異）${spotTxt}`;
                return;
            }
            btn.classList.remove('hidden');
            // 開著圖層而差異歸零時**不可以**隱藏——否則關掉它的唯一入口消失了
            btn.innerText = n
                ? `✏ 新增 ${d.add.length} · 拆掉 ${d.del.length} · 改過 ${d.chg.length} 格`
                    + `（${d.groups.length} 處${d.groups.length > 40 ? '，已在地圖上全部標亮' : '，點號碼可跳'}）${spotTxt}`
                : '✏ 與原始完全相同（點關閉差異）';
        }

        /* ─── 整圖圖層的唯一進出點 ───
           動線與差異都是「整張圖的逐格色洗」，疊起來是泥巴 → 一次只能開一個。
           兩個各自知道對方存在的 toggle 遲早會出現「兩個都亮」，所以收成一支
           （理由同 setLocateMode 的「唯一進出點」）。持久旗標仍是 prefs.flowOn／prefs.diffOn，
           localStorage 的 key 名一個都沒改。 */
        function setMapLayer(which) {
            if (which === 'flow' && !lastHasGate) { showSysMsg('地圖上沒有校門，無法計算動線', true); return false; }
            if (which === 'diff' && !originComparable()) { showSysMsg('沒有可比對的原始地圖', true); return false; }
            savePrefs({ flowOn: which === 'flow', diffOn: which === 'diff' });
            styleFlowBtn();
            updateFlowOverlay();
            renderDiffOverlay();
            syncSuggestBtn();
            updateToolHint(currentTool, updateSuggestions());
            return true;
        }

        function toggleDiff() {
            if (!originComparable()) {
                showSysMsg(origin && !originGrid ? '這張圖只剩來歷記錄，無法逐格比對' : '目前沒有可比對的原始地圖', true);
                return;
            }
            // 定位中按它＝「我要看差異」→ 先清掉聚光燈，圖層自己回來
            if (prefs.diffOn && !diffActive()) { clearLocate(); return; }
            const want = !prefs.diffOn;
            // 剛按下「點看差異」的這一下也是明確意圖：聚光燈讓位，不要讓他看到一片空白
            if (want) clearLocate();
            track('toggle_diff', { on: want, kind: origin ? origin.kind : 'none' });
            setMapLayer(want ? 'diff' : null);
            showSysMsg(want
                ? '差異圖層：+ 新增、− 拆掉、≠ 改過（種類或高度）；景點標記照常顯示'
                : '已關閉差異圖層');
        }

        // 回到原始狀態：破壞性動作 → 走統一守衛，而且自己也要可 Ctrl+Z
        function restoreOrigin() {
            if (!originComparable()) { showSysMsg('沒有可還原的原始地圖', true); return; }
            const keep = origin;
            guardDestructive(`回到「${origin.name}」的原始狀態`, () => {
                pushHistory();
                if (importGridData(decodeMap(keep.code))) {
                    track('origin_restore', { kind: keep.kind });
                    adoptOrigin(keep);
                    markClean(keep.town || null);
                    showSysMsg(`已回到原始狀態：${keep.name}`);
                }
            });
        }

        /* 城鎮鈕的字樣就是狀態，所以「取消切換」不可能讓控制項說謊，
           而非五鎮的尺寸（貼上任意尺寸的分享碼）也一定看得見＝「自訂 R×C」。 */
        function townLabel() {
            const p = currentTownKey && PRESETS[currentTownKey];
            if (p && p.rows === gridRows && p.cols === gridCols) return p.name;
            return `自訂 ${gridRows}×${gridCols}`;
        }
        function updateTownLabel() {
            const b = document.getElementById('townBtn');
            if (b) b.innerText = '🗺 ' + townLabel() + ' ▾';
        }

        // ─── 破壞性動作的單一守衛（城鎮切換／貼上載入／讀取存檔／清空共用）───
        let askState = null;
        function guardDestructive(what, proceed) {
            if (!isDirty()) { proceed(); return; }
            document.getElementById('askBody').innerText =
                what + '。目前未儲存的編輯不會保留（誤按可用 Ctrl+Z 還原）。';
            document.getElementById('askName').value = suggestSaveName();
            askState = { proceed, opener: document.activeElement };
            document.getElementById('askModal').classList.remove('hidden');
            document.getElementById('askSave').focus();  // 預設焦點＝最安全的那顆
        }
        function closeAsk(run) {
            document.getElementById('askModal').classList.add('hidden');
            const st = askState;
            askState = null;
            if (st && st.opener && st.opener.focus) { try { st.opener.focus(); } catch (e) {} }
            if (run && st) st.proceed();
        }
        // 「存成新檔」就不能靜默蓋掉別人 → 撞名自動補「 2」「 3」…，而且名字顯示出來可改
        function suggestSaveName() {
            const base = document.getElementById('saveName').value.trim() || townLabel() || '我的地圖';
            let maps = {};
            try { maps = JSON.parse(localStorage.getItem('pa2_maps_v9')) || {}; } catch (e) {}
            if (!maps[base]) return base;
            for (let i = 2; i < 99; i++) if (!maps[base + ' ' + i]) return base + ' ' + i;
            return base + ' ' + Date.now();
        }

        // 儲存（頂列的「儲存」與對話框的「儲存並繼續」共用）：撞名一定先問
        function saveMapAs(name) {
            if (!name) { showSysMsg('請先輸入地圖名稱', true); return false; }
            try {
                const maps = JSON.parse(localStorage.getItem('pa2_maps_v9')) || {};
                if (maps[name] && !confirm(`已有存檔「${name}」，要覆蓋嗎？`)) return false;
                maps[name] = { data: gridData, ts: Date.now() };
                localStorage.setItem('pa2_maps_v9', JSON.stringify(maps));
                track('save_map');
                renderLoadPanel();
                document.getElementById('saveName').value = name;
                savePrefs({ lastSave: name });
                markClean();   // 已經落地 → 之後切鎮不必再問
                showSysMsg(`已儲存：${name}`);
                return true;
            } catch (e) { showSysMsg('儲存失敗！', true); return false; }
        }

        function clearMap() {
            track('clear_map');
            pushHistory();
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    gridData[r][c] = { type: 'empty', elevation: 1 };
                    updateTileVisuals(r, c);
                }
            }
            checkSpots();
            document.getElementById('saveName').value = '';
            markClean(null);   // 空白畫布不屬於任何城鎮
            // 空白畫布是合法的來歷，但「跟空白比差異」沒有意義 → originComparable() 會擋掉那一列
            setOrigin({ kind: 'blank', name: `空白畫布 ${gridRows}×${gridCols}`, from: '', town: null });
            showSysMsg(`已清成空白畫布（${gridRows}×${gridCols}）`);
        }

        /* 一個入口辨識三種輸入：完整分享連結、裸 `#m=` 短碼、舊版 JSON 存檔碼。
           兩種格式繼續躺在程式裡，使用者只需要理解「一個分享」。 */
        function loadFromText(raw) {
            const text = (raw || '').trim();
            if (!text) { showSysMsg('請先貼上分享連結或代碼', true); return false; }
            if (text[0] === '[') {   // 舊版 JSON 存檔碼
                try {
                    const parsed = JSON.parse(text);
                    pushHistory();
                    if (importGridData(parsed)) {
                        track('import_code', { fmt: 'json' });
                        markClean(matchTown(gridData));
                        setOrigin({ kind: 'share', name: '貼上的地圖', from: '舊版 JSON 存檔碼', town: matchTown(gridData) });
                        showSysMsg('已載入（舊版存檔碼）');
                        return true;
                    }
                } catch (e) {}
                showSysMsg('存檔碼格式錯誤', true);
                return false;
            }
            const m = /[#&?]m=([A-Za-z0-9\-_]+)/.exec(text);
            const code = m ? m[1] : (/^[A-Za-z0-9\-_]+$/.test(text) ? text : null);
            if (code) {
                const grid = decodeMap(code);
                if (grid) {
                    pushHistory();
                    if (importGridData(grid)) {
                        track('import_code', { fmt: 'share' });
                        // 貼進來的可能就是佈局頁那條連結 → 認得出來就報得出名字
                        const meta = originFromCode(code);
                        markClean(meta.town || matchTown(gridData));
                        setOrigin(meta);
                        track('load_site_layout', { kind: meta.kind, name: meta.name });
                        showSysMsg('已載入：' + meta.name);
                        return true;
                    }
                }
            }
            showSysMsg('無法辨識這段內容（支援分享連結、#m= 代碼、舊版 JSON 存檔碼）', true);
            return false;
        }

        /* 網址 hash 帶進來的分享碼（＝佈局頁那顆「🧩 在模擬器開啟」）。
           與貼上載入走同一組規則：先問（有未儲存的編輯時）、pushHistory（誤按可 Ctrl+Z）、
           報得出名字、成功後才清掉 hash。 */
        function applySharedGrid(code, grid) {
            const meta = originFromCode(code);
            const apply = () => {
                pushHistory();
                if (!importGridData(grid)) { showSysMsg('分享的地圖格式錯誤', true); return; }
                markClean(meta.town || matchTown(gridData));
                setOrigin(meta);
                track('load_site_layout', { kind: meta.kind, name: meta.name });
                showSysMsg('已載入：' + meta.name);
                /* 成功載入後就把 #m= 清掉：留著它，使用者接下來的編輯會在下一次重新整理時
                   被分享碼整份蓋掉。解碼失敗或使用者取消時刻意不清，那串碼還看得到。 */
                try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
            };
            if (isDirty()) guardDestructive(`載入「${meta.name}」會換掉目前的畫布`, apply);
            else apply();
        }

        function loadSavedMap(name) {
            try {
                const maps = JSON.parse(localStorage.getItem('pa2_maps_v9')) || {};
                const entry = maps[name];
                const data = Array.isArray(entry) ? entry : (entry && entry.data); // 相容舊格式
                if (!data) { showSysMsg('讀取失敗！', true); return; }
                pushHistory();
                if (importGridData(data)) {
                    track('load_map');
                    document.getElementById('saveName').value = name;
                    savePrefs({ lastSave: name });
                    markClean(matchTown(gridData));
                    setOrigin({ kind: 'save', name: name, from: '讀取時的內容', town: matchTown(gridData) });
                    showSysMsg(`已讀取：${name}`);
                }
            } catch (e) { showSysMsg('讀取失敗！', true); }
        }

        // ─── 彈出面板：清單式，每一列都可點（取代「選一個下拉、再猜按哪顆動詞」）───
        function esc(s) {
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
        function renderTownPanel() {
            const pop = document.getElementById('townPop');
            if (!pop) return;
            const rows = Object.entries(PRESETS).map(([key, p]) => {
                const here = key === currentTownKey && p.rows === gridRows && p.cols === gridCols;
                // 只換尺寸＝保留已畫內容（臨摹到一半才發現自己玩的是另一鎮）
                const sizeBtn = (p.rows !== gridRows || p.cols !== gridCols)
                    ? `<button class="town-size text-[10px] font-bold text-gray-500 hover:text-gray-800 shrink-0 px-1.5 py-2" data-town="${key}" title="只把畫布改成 ${p.rows}×${p.cols}，已畫的內容保留">只換尺寸</button>`
                    : '';
                return `<div class="flex items-center">
                    <button class="pop-row town-row hover:bg-gray-100 flex-1 min-w-0" data-town="${key}">
                        <span class="flex-1 min-w-0">
                            <span class="font-black text-gray-800">${esc(p.name)}</span>
                            <span class="text-gray-400"> ${p.rows}×${p.cols}</span>
                            <span class="block text-[10px] text-gray-500 truncate">${esc(p.desc || '')}</span>
                        </span>
                        ${here ? '<span class="text-[10px] font-bold text-gray-500 shrink-0">重新載入</span>' : ''}
                    </button>${sizeBtn}</div>`;
            }).join('');
            pop.innerHTML = rows + '<div class="pop-sep border-gray-200"></div>'
                + `<button class="pop-row clear-row hover:bg-red-100 text-red-600 font-bold w-full">🧹 空白畫布（清空目前 ${gridRows}×${gridCols}）</button>`;
        }

        function renderLoadPanel() {
            const pop = document.getElementById('loadPop');
            if (!pop) return;
            let maps = {};
            try { maps = JSON.parse(localStorage.getItem('pa2_maps_v9')) || {}; } catch (e) {}
            const names = Object.keys(maps);
            const rows = names.length ? names.map(name => {
                const e = maps[name];
                const ts = e && !Array.isArray(e) && e.ts;
                const d = ts ? new Date(ts) : null;
                const when = d ? `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}` : '';
                const n = esc(name);
                return `<div class="flex items-center">
                    <button class="pop-row save-row hover:bg-gray-100 flex-1 min-w-0" data-name="${n}">
                        <span class="flex-1 min-w-0 truncate font-bold text-gray-800">${n}</span>
                        <span class="text-[10px] text-gray-400 shrink-0">${when}</span>
                    </button>
                    <button class="save-ren text-[11px] text-gray-400 hover:text-gray-700 shrink-0 px-1.5 py-2" data-name="${n}" title="改名">✏</button>
                    <button class="save-del text-[11px] text-gray-400 hover:text-gray-700 shrink-0 px-1.5 py-2" data-name="${n}" title="刪除">🗑</button>
                </div>`;
            }).join('') : '<div class="pop-row text-gray-400">還沒有存檔</div>';
            // 貼上載入與「讀取」放在一起：它們是同一件事（把畫布整份換掉），走同一個守衛
            pop.innerHTML = rows + '<div class="pop-sep border-gray-200"></div>'
                + `<div class="px-2 pb-1">
                    <div class="text-[11px] font-bold text-gray-500 mb-1">貼上並載入</div>
                    <textarea id="pasteBox" rows="2" class="w-full text-[11px] border border-gray-300 rounded p-1.5 bg-white outline-none focus:border-blue-400" placeholder="分享連結、#m= 代碼或舊版 JSON 存檔碼"></textarea>
                    <button id="pasteLoadBtn" class="mt-1 w-full text-[11px] font-bold bg-gray-100 hover:bg-gray-200 text-gray-700 border border-gray-300 rounded py-1.5">載入</button>
                </div>`;
        }

        function seedProgressSave() {
            // 只在第一次開啟時植入，之後即使被刪除也不會再出現
            try {
                if (localStorage.getItem('pa2_seed_done_v1')) return;
                const maps = JSON.parse(localStorage.getItem('pa2_maps_v9')) || {};
                if (!maps['健康鎮進度']) {
                    maps['健康鎮進度'] = { data: JSON.parse(PROGRESS_SEED_DATA), ts: Date.now() };
                    localStorage.setItem('pa2_maps_v9', JSON.stringify(maps));
                }
                localStorage.setItem('pa2_seed_done_v1', '1');
            } catch (e) { console.error('初始化進度存檔失敗'); }
        }

        // 面板搜尋：依名稱/標籤過濾，整組沒結果的分類自動隱藏
        function filterPalette(q) {
            q = (q || '').trim().toLowerCase();
            document.querySelectorAll('.palette-item').forEach(el => {
                const id = el.id.replace('tool-', '');
                const item = items[id];
                const hit = !q || item.name.toLowerCase().includes(q) || id.includes(q) || (item.short && item.short.includes(q));
                el.style.display = hit ? '' : 'none';
            });
            ['palette-tools', 'palette-env', 'palette-fac', 'palette-spec', 'palette-sports', 'palette-farm'].forEach(cid => {
                const cont = document.getElementById(cid);
                if (!cont) return;
                const any = [...cont.children].some(ch => ch.style.display !== 'none');
                cont.parentElement.style.display = any ? '' : 'none';
            });
            highlightSearch(q);
        }

        // 搜尋定位：把地圖上符合的設施全部高亮，並在搜尋框下統計棟數
        // （多格建築以 bid 算「棟」；水塘/草地等環境地形算「格」）。
        // 地圖每次變動後由 checkSpots() 重新套用，清除搜尋即還原。
        //
        // 命中集合有兩個來源，分開記：
        //   ㈠ 搜尋框打字 → 先試「完全相符」，沒有才退回模糊比對
        //      （模糊比對是給「球場」這種想一次看四種球場的用法；但打「教室」時
        //        使用者要的只有教室本身，不該連多媒體教室、社團教室一起亮）
        //   ㈡ 點選調色盤上的設施 → 只亮那一種
        //      （先前的 bug：打完字再點其中一項，地圖仍停在打字時的模糊集合）
        let searchTerm = '';
        let hlIds = null;   // 目前高亮的型別集合（null = 沒在高亮）
        // 地圖定位一律「完全比對」：名稱／id／單字標籤完全相符才亮。
        // 調色盤的篩選仍是模糊的（打「球場」列出四種球場方便找），但地圖不會跟著亂亮一片；
        // 想定位其中某一種，點那一項即可（selectTool → highlightSelected）。
        function typesForTerm(term) {
            return Object.keys(items).filter(id => {
                const it = items[id];
                if (it.hidden || id === 'empty' || it.type === 'tool') return false;
                return it.name.toLowerCase() === term || id === term || (it.short || '').toLowerCase() === term;
            });
        }
        function highlightSearch(q) {
            searchTerm = (q || '').trim().toLowerCase();
            const ids = searchTerm ? typesForTerm(searchTerm) : [];
            hlIds = ids.length ? new Set(ids) : null;
            applyHighlight();
        }
        /* 點選設施：只定位這一種。
           地圖上**沒有**這種設施時，不但不開聚光燈，還要把前一次的定位收掉——
           否則會卡在「亮著上一種設施、又不畫這一種的建議框」的混合狀態。 */
        function highlightSelected(id) {
            const it = items[id];
            if (!it || it.hidden || id === 'empty' || it.type === 'tool') return;
            /* 差異圖層開著時**不自動**進定位模式。
               這裡是「選了一個已經蓋過的設施」的自動觸發，而差異圖層是使用者明確開的
               持久模式 —— 明確意圖優先於自動行為。不擋的話，「照著範例改」的每一次選筆刷
               都會把差異圖層踢成暫停（選建築 → 差異沒了 → 再開 → 再選 → 又沒了），
               三次之後沒有人會再開它。
               打字搜尋（highlightSearch）是另一個**明確**意圖，照樣可以進定位、
               差異圖層會暫停並在那一列留一條回來的路。 */
            if (prefs.diffOn && originComparable()) {
                if (hlIds) { hlIds = null; applyHighlight(); }
                return;
            }
            const built = gridData.some(row => row.some(cell => cell.type === id));
            if (!built) { if (hlIds) { hlIds = null; applyHighlight(); } return; }
            hlIds = new Set([id]);
            applyHighlight();
        }
        /* 一次清掉所有「景點相關」的地圖覆蓋層。
           原本這些清除散在 9 個地方，所以每次改都會漏一個 —— 這是結構性原因，
           不是粗心。集中在一支之後，「定位模式要乾淨」只需要呼叫它。 */
        function clearSpotOverlays() {
            document.querySelectorAll('.tile.suggest, .tile.suggest2')
                .forEach(t => t.classList.remove('suggest', 'suggest2'));
            document.querySelectorAll('.spot-indicators, .spot-tooltip, .spot-area-ov')
                .forEach(n => n.remove());
            document.querySelectorAll('.tile.ring-2')
                .forEach(t => t.classList.remove('ring-2', 'ring-yellow-400', 'ring-inset', 'z-10'));
        }

        /* 定位模式的唯一進出點。
           進：抹掉景點覆蓋層（源頭 guard 在 updateSpotIndicators／updateToolHint／
               updateSuggestions，負責之後不再產生）
           出：直接讓 checkSpots() 重畫 —— 景點標記本來就是它畫的，不必自己重建 */
        function setLocateMode(on) {
            const b = document.body;
            if (b.classList.contains('locating') === !!on) return;
            b.classList.toggle('locating', !!on);
            syncSuggestBtn();
            if (on) { clearSpotOverlays(); renderDiffOverlay(); }  // 差異圖層暫停（不是取消）
            else checkSpots();                                     // 出定位：景點與差異一起回來
        }
        // 清掉定位（聚光燈）。差異圖層被暫停時，那一列就是靠這支把它救回來的出路。
        function clearLocate() {
            if (!hlIds) return;
            hlIds = null;
            applyHighlight();
        }
        /* suggestBtn 的 disabled 有兩個主人（定位模式與差異圖層）→ 收成一支，
           不然「關掉差異」會把仍在定位模式的建議鈕重新啟用。 */
        function syncSuggestBtn() {
            const btn = document.getElementById('suggestBtn');
            if (!btn) return;
            const locating = document.body.classList.contains('locating');
            btn.disabled = locating || diffActive();
            btn.title = locating ? '定位中不顯示景點建議框（清除定位後可用）'
                : (diffActive() ? '差異圖層開著時不顯示建議框（它畫在空格上，會與「拆掉」重複標記）'
                : '顯示可完成景點的建議位置');
        }

        function applyHighlight() {
            document.querySelectorAll('.tile.found').forEach(t => t.classList.remove('found'));
            document.querySelectorAll('.found-num').forEach(n => n.remove());
            setLocateMode(!!hlIds);
            const hits = document.getElementById('searchHits');
            if (!hits) return;
            if (!hlIds) {
                document.body.classList.remove('searching');
                // 有打字但沒有完全相符時給提示，而不是靜靜地什麼都不做
                if (searchTerm) { hits.style.display = ''; hits.innerText = '要在地圖上定位，請輸入完整設施名稱，或直接點下方的設施'; }
                else hits.style.display = 'none';
                return;
            }
            const matched = hlIds;
            const bids = {}, singles = {};
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    const cell = gridData[r][c];
                    if (!matched.has(cell.type)) continue;
                    const el = tileAt(r, c);
                    if (el) el.classList.add('found');
                    if (cell.bid) (bids[cell.type] = bids[cell.type] || new Set()).add(cell.bid);
                    else singles[cell.type] = (singles[cell.type] || 0) + 1;
                }
            }
            const parts = [];
            matched.forEach(id => {
                const n = (bids[id] ? bids[id].size : 0) + (singles[id] || 0);
                if (n) parts.push(items[id].name + ' ' + n + (items[id].w || items[id].h ? ' 棟' : ' 格'));
            });
            // 聚光燈只在真的有找到時開，避免搜不到東西卻整張圖變暗
            document.body.classList.toggle('searching', parts.length > 0);
            hits.style.display = '';
            if (!parts.length) { hits.innerHTML = '<span class="sh-sum">地圖上沒有符合的設施</span>'; hlSpots = []; return; }

            /* 位置用「地圖上的序號徽章」交代，不列座標 —— 座標是給機器看的格式，
               而且 hover 與跳轉時左下座標列本來就會顯示同一串。
               超過 NUM_CAP 棟就不標號（草地／水塘動輒上百格，標號只是噪音）。 */
            const NUM_CAP = 40;
            hlSpots = locateSpots(matched);
            const total = hlSpots.length;
            if (total <= NUM_CAP) {
                hlSpots.forEach((s, i) => {
                    const el = tileAt(s.r, s.c);
                    if (!el) return;
                    const b = document.createElement('button');
                    b.className = 'found-num';
                    b.dataset.i = i;
                    b.textContent = i + 1;
                    b.title = '跳到第 ' + (i + 1) + ' 個';
                    el.appendChild(b);
                });
            }
            hits.innerHTML = '<span class="sh-sum">📍 ' + parts.join('、') + '</span>'
                + '<span class="sh-hint">'
                + (total <= NUM_CAP ? '地圖上標了 1–' + total + '，點號碼可跳過去' : '已在地圖上全部標亮')
                + '</span>';
        }

        /* 把命中的格子收斂成「一棟一個位置」：多格建築取左上角（同 bid 只算一次），
           1×1 的環境地形每格算一個。依 X→Y 排序，與地圖的閱讀順序一致。 */
        function locateSpots(matched) {
            const seen = new Set(), out = [];
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    const cell = gridData[r][c];
                    if (!matched.has(cell.type)) continue;
                    if (cell.bid !== undefined) {
                        if (seen.has(cell.bid)) continue;
                        seen.add(cell.bid);
                    }
                    out.push({ r, c });
                }
            }
            return out;
        }
        let hlSpots = [];

        /* 跳到某一格：把捲動容器移到讓它居中，並閃三下。
           用 scrollLeft/Top 直接算而不用 scrollIntoView——後者會連整頁一起捲。 */
        function focusCell(r, c) {
            const el = tileAt(r, c);
            const box = document.getElementById('mapContainer');
            if (!el || !box) return;
            box.scrollTo({
                left: el.offsetLeft - box.clientWidth / 2 + el.offsetWidth / 2,
                top: el.offsetTop - box.clientHeight / 2 + el.offsetHeight / 2,
                behavior: 'smooth'
            });
            document.querySelectorAll('.tile.locate').forEach(t => t.classList.remove('locate'));
            el.classList.add('locate');
            setTimeout(() => el.classList.remove('locate'), 1600);
            updateCoordHint(r, c);
        }

        // 最近使用列（存進偏好，跨次記憶）
        function renderRecent() {
            const row = document.getElementById('recentRow');
            if (!row) return;
            const list = (prefs.recent || []).filter(id => items[id] && !items[id].hidden);
            row.innerHTML = list.length
                ? '<span class="text-[10px] text-gray-400 self-center">最近：</span>' + list.map(id =>
                    `<button class="recent-chip w-7 h-7 rounded border border-gray-200 shadow-sm text-[14px] flex items-center justify-center hover:scale-110 transition" style="background:${items[id].color}" title="${items[id].name}" data-tool="${id}">${ITEM_ICONS[id] || items[id].short}</button>`
                ).join('')
                : '';
        }

        // 為預設圖/舊存檔中的多格建築自動標記棟別（貪婪：由左上往右下找完整 w×h 區塊）
        function assignBlockIds() {
            let maxBid = 0;
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    const b = gridData[r][c].bid;
                    if (b && b > maxBid) maxBid = b;
                }
            }
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    const t = gridData[r][c].type;
                    const it = items[t];
                    if (!it) continue;
                    const w = it.w || 1, h = it.h || 1;
                    if (w * h <= 1 || gridData[r][c].bid) continue;
                    if (r + h > gridRows || c + w > gridCols) continue;
                    let ok = true;
                    for (let dr = 0; dr < h && ok; dr++) {
                        for (let dc = 0; dc < w && ok; dc++) {
                            const cell = gridData[r + dr][c + dc];
                            if (cell.type !== t || cell.bid) ok = false;
                        }
                    }
                    if (!ok) continue;
                    const bid = ++maxBid;
                    for (let dr = 0; dr < h; dr++) {
                        for (let dc = 0; dc < w; dc++) gridData[r + dr][c + dc].bid = bid;
                    }
                }
            }
            blockIdCounter = maxBid;
        }

        function importGridData(parsed) {
            if (!Array.isArray(parsed) || !parsed.length || !Array.isArray(parsed[0])) return false;

            // 自動偵測尺寸：存檔/預設圖/分享碼帶著自己的行列數，跟目前不同就切換
            const pr = parsed.length, pc = Math.max(...parsed.map(row => (row || []).length));
            if (pr >= 5 && pr <= 40 && pc >= 5 && pc <= 40 && (pr !== gridRows || pc !== gridCols)) {
                setGridSize(pr, pc, false);
            }

            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    const val = parsed[r] && parsed[r][c] ? parsed[r][c] : { type: 'empty', elevation: 1 };
                    const cellValue = typeof val === 'object' ? (val.type || 'empty') : (val || 'empty');
                    const cellElev = typeof val === 'object' ? (val.elevation || 1) : 1;

                    gridData[r][c] = { type: cellValue, elevation: cellElev };
                    if (typeof val === 'object' && val.bid) gridData[r][c].bid = val.bid;
                }
            }
            assignBlockIds();
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) updateTileVisuals(r, c);
            }
            checkSpots();
            return true;
        }

        /* ─── 觸控手勢：雙指拖曳＝平移、捏合＝縮放 ───
           手機沒有滑鼠中鍵（唯一的平移機制），放大後就再也看不到地圖其他部分，
           唯一逃生口是把倍率按回 100% —— 這是個單向陷阱。
           單指行為完全不變（繪製／長按吸管），導覽一律退到雙指，與 Freeform／Notes 標記模式同慣例。
           監聽掛在 #mapContainer 而不是 #gameGrid：第一指可能落在座標軸標籤（沒有 touch 監聽）上，
           掛在格線上會讓那條入場路徑整個失效。 */
        const PINCH_ON = 0.08;  // 捏合啟動門檻：手指微抖不該讓倍率跳動
        const PAN_ON = 10;      // 平移啟動門檻（px）

        function twoFinger(e) {
            const a = e.touches[0], b = e.touches[1];
            return {
                dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
                x: (a.clientX + b.clientX) / 2,
                y: (a.clientY + b.clientY) / 2
            };
        }

        // 平移：先餵目前的捲動層，它吃不下的餘量（已到邊界）再餵外層 main。
        // .map-container 與 main 都是 overflow:auto，只推一層會重演「放大後上緣捲不到」。
        function panMap(dx, dy) {
            const seen = new Set();
            for (const el of [mapScroller(), document.querySelector('main')]) {
                if (!el || seen.has(el)) continue;
                seen.add(el);
                if (dx) { const b = el.scrollLeft; el.scrollLeft = b + dx; dx -= el.scrollLeft - b; }
                if (dy) { const b = el.scrollTop; el.scrollTop = b + dy; dy -= el.scrollTop - b; }
            }
        }

        /* 第二指落下時中止進行中的單指筆劃，否則縮放過程會畫出一條線。
           剛起筆（≤1 格或按下不到 250ms）就把那一步整個撤回——意圖顯然是縮放而不是畫圖；
           但若已經連刷了一長條就保留該筆、只停止繪製（無腦還原會吃掉真實工作）。 */
        function abortTouchStroke() {
            clearTimeout(longPressTimer);
            let restored = false;
            if (touchState && touchState.painted) {
                const brief = touchState.cells <= 1 || (Date.now() - touchState.t0) < 250;
                if (brief && undoStack.length) {
                    restoreSnapshot(undoStack.pop());  // 不動 redoStack：等於這一筆沒發生過
                    updateHistoryButtons();
                    restored = true;
                }
            }
            isDrawing = false;
            rectStart = rectEnd = null;
            document.querySelectorAll('.tile.rect-preview').forEach(t => t.classList.remove('rect-preview'));
            document.querySelectorAll('.tile.fp-preview').forEach(t => t.classList.remove('fp-preview'));
            touchState = null;
            if (restored) heavyPending = false; else flushCheckSpots();
        }

        function setupTouchGestures() {
            const box = document.getElementById('mapContainer');
            if (!box) return;
            let raf = 0, pending = null;
            function flushZoom() {
                raf = 0;
                if (!pending) return;
                const p = pending; pending = null;
                // transient：手勢中不寫 localStorage（每帧同步寫入會頓）；rAF 節流避免每個
                // touchmove 都跑一次 fitGrid（整張網格重排）
                setZoom(p.z, { x: p.x, y: p.y }, true);
            }

            box.addEventListener('touchstart', (e) => {
                if (e.touches.length < 2) return;
                e.preventDefault();
                abortTouchStroke();
                suppressTouchDraw = true;  // 手指全部離開前不再進入繪製
                const g = twoFinger(e);
                gesture = { d0: g.dist, x: g.x, y: g.y, z0: zoomLevel, panning: false, zooming: false, moved: 0 };
            }, { passive: false });

            box.addEventListener('touchmove', (e) => {
                if (!gesture || e.touches.length < 2) return;
                e.preventDefault();
                const g = twoFinger(e);
                // 平移用「這一帧相對上一帧」的增量：縮放會在同一手勢中改寫 scrollLeft/Top，
                // 用「起始捲動位置＋總位移」計算會讓平移與縮放互相打架。
                const dx = g.x - gesture.x, dy = g.y - gesture.y;
                gesture.moved += Math.abs(dx) + Math.abs(dy);
                if (!gesture.panning && gesture.moved > PAN_ON) gesture.panning = true;
                if (gesture.panning) panMap(-dx, -dy);
                gesture.x = g.x; gesture.y = g.y;
                const ratio = g.dist / Math.max(1, gesture.d0);
                if (!gesture.zooming && Math.abs(ratio - 1) > PINCH_ON) {
                    gesture.zooming = true;      // 啟動當下重設基準，避免門檻造成的跳動
                    gesture.d0 = g.dist;
                    gesture.z0 = zoomLevel;
                }
                if (gesture.zooming) {
                    let z = gesture.z0 * (g.dist / Math.max(1, gesture.d0));
                    if (Math.abs(z - 1) < 0.05) z = 1;  // 100% 附近的磁吸凹點，讓人找得回原尺寸
                    pending = { z, x: g.x, y: g.y };     // 錨點＝兩指中點
                    if (!raf) raf = requestAnimationFrame(flushZoom);
                }
            }, { passive: false });

            function endGesture(e) {
                if (!gesture) return;
                if (e.touches.length >= 2) {  // 三指變兩指：重設基準後續行
                    const g = twoFinger(e);
                    gesture.d0 = g.dist; gesture.x = g.x; gesture.y = g.y; gesture.z0 = zoomLevel;
                    return;
                }
                if (raf) { cancelAnimationFrame(raf); flushZoom(); }
                gesture = null;
                savePrefs({ zoom: +zoomLevel.toFixed(2) });  // 手勢結束才寫回倍率
            }
            box.addEventListener('touchend', (e) => {
                endGesture(e);
                // 只剩一指時不立刻退回繪製；要等手指全部離開（避免縮放尾聲多畫一格）
                if (e.touches.length === 0) suppressTouchDraw = false;
            });
            box.addEventListener('touchcancel', (e) => {
                endGesture(e);
                if (e.touches.length === 0) suppressTouchDraw = false;
            });
            // iOS Safari 的私有手勢事件會繞過 touch-action，觸發整頁的視覺縮放
            box.addEventListener('gesturestart', e => e.preventDefault());
            box.addEventListener('gesturechange', e => e.preventDefault());
        }

        function setupEventListeners() {
            document.getElementById('undoBtn').addEventListener('click', undo);
            document.getElementById('redoBtn').addEventListener('click', redo);

            // 縮放/平移
            document.getElementById('zoomInBtn').addEventListener('click', () => setZoom(zoomLevel * 1.25));
            document.getElementById('zoomOutBtn').addEventListener('click', () => setZoom(zoomLevel / 1.25));
            document.getElementById('zoomResetBtn').addEventListener('click', () => setZoom(1));
            document.getElementById('zoomResetBtn').innerText = Math.round(zoomLevel * 100) + '%';
            // 掛在 main 上,正常視角(容器捲)與斜視(main 捲)的事件都冒泡得到
            const mapMain = document.querySelector('main');
            // Ctrl+滾輪:以游標為中心縮放;一般滾輪維持原生捲動(平移)
            mapMain.addEventListener('wheel', (e) => {
                if (!e.ctrlKey) {
                    /* 漸進揭露：只在「這個手勢什麼都沒發生」時才提示 Ctrl+滾輪。
                       放大後滾動＝平移，那是刻意保留的正確行為，在使用者做對事時提示另一個
                       功能只會變成噪音；捲到邊界卻還在滾，才是真的卡住。 */
                    if (prefs.zoomHint) return;
                    const sc = mapScroller();
                    if (!sc) return;
                    const before = sc.scrollTop;
                    setTimeout(() => {
                        if (sc.scrollTop !== before) return;   // 有捲到＝正常平移，不打擾
                        savePrefs({ zoomHint: 1 });
                        showSysMsg('已到邊界：按住 Ctrl 再滾輪可以游標為中心縮放');
                    }, 60);
                    return;
                }
                e.preventDefault();
                setZoom(zoomLevel * (e.deltaY < 0 ? 1.15 : 1 / 1.15), { x: e.clientX, y: e.clientY });
            }, { passive: false });
            // 滑鼠中鍵拖曳平移(左鍵保留給畫圖)
            let panState = null;
            mapMain.addEventListener('mousedown', (e) => {
                if (e.button !== 1) return;
                e.preventDefault();  // 擋掉瀏覽器的中鍵自動捲動
                const sc = mapScroller();
                panState = { sc, x: e.clientX, y: e.clientY, sl: sc.scrollLeft, st: sc.scrollTop };
            });
            window.addEventListener('mousemove', (e) => {
                if (!panState) return;
                panState.sc.scrollLeft = panState.sl - (e.clientX - panState.x);
                panState.sc.scrollTop = panState.st - (e.clientY - panState.y);
            });
            window.addEventListener('mouseup', () => { panState = null; });
            setupTouchGestures();  // 觸控：雙指拖曳平移、捏合縮放（手機沒有中鍵）

            // 打字去抖動：每個按鍵都掃全圖＋改 DOM 會頓，停手 120ms 再算（篩選調色盤本身很輕，立即做）
            let searchTimer = null;
            document.getElementById('paletteSearch').addEventListener('input', (e) => {
                const v = e.target.value;
                clearTimeout(searchTimer);
                searchTimer = setTimeout(() => filterPalette(v), 120);
            });
            document.getElementById('paletteSearch').addEventListener('keydown', (e) => {
                if (e.key === 'Escape') { e.target.value = ''; filterPalette(''); e.target.blur(); }
            });
            document.getElementById('recentRow').addEventListener('click', (e) => {
                const btn = e.target.closest('.recent-chip');
                if (btn) selectTool(btn.dataset.tool);
            });

            /* 筆刷／矩形是「改變下一次點擊的後果」＝模式，做成互斥的分段控制，
               與 💡建議／👣動線（改變地圖顯示什麼＝圖層）在外觀上分家。
               Shift 的替代路徑寫在切換時的提示裡，不在按鈕上加鍵帽（那是往最擠的地方加裝飾）。 */
            document.getElementById('brushBtn').addEventListener('click', () => setDrawMode(false));
            document.getElementById('rectBtn').addEventListener('click', () => setDrawMode(true));

            document.getElementById('searchClearBtn').addEventListener('click', () => {
                const inp = document.getElementById('paletteSearch');
                inp.value = '';
                filterPalette('');
                inp.focus();
            });

            // 命中座標晶片 → 跳到那一棟（事件委派：晶片是每次重繪的）
            /* 序號徽章：點了要跳到那一棟，而**不能**順手在那一格畫圖。
               繪製是綁 mousedown／touchstart（不是 click），所以只在 click 上
               stopPropagation 擋不到 —— 必須在**捕獲階段**先攔掉，才會早於
               格子自己的 target 階段監聽器。 */
            const grid = document.getElementById('gameGrid');
            ['mousedown', 'touchstart'].forEach(ev => grid.addEventListener(ev, (e) => {
                if (e.target.closest('.found-num')) { e.stopPropagation(); e.preventDefault(); }
            }, true));
            grid.addEventListener('click', (e) => {
                const num = e.target.closest('.found-num');
                if (!num) return;
                // 同一種徽章服務兩件事：定位命中（.found-num）與變更區塊（.found-num.dn）。
                // 兩者互斥（差異圖層在定位模式下暫停），所以不會同時有號碼在圖上。
                const dn = num.classList.contains('dn');
                const sp = (dn ? diffSpots : hlSpots)[+num.dataset.i];
                if (sp) { focusCell(sp.r, sp.c); track(dn ? 'locate_diff' : 'locate_facility'); }
            });

            document.getElementById('suggestBtn').addEventListener('click', () => {
                savePrefs({ suggestOff: !prefs.suggestOff });
                track('toggle_suggest', { on: !prefs.suggestOff });
                styleSuggestBtn();
                updateToolHint(currentTool, updateSuggestions());
                showSysMsg(prefs.suggestOff ? '已隱藏地圖上的建議標示' : '已顯示建議標示');
            });

            document.getElementById('flowBtn').addEventListener('click', () => toggleFlow());

            document.getElementById('exportImgBtn').addEventListener('click', () => { track('export_image'); exportImage(); });
            document.getElementById('shareBtn').addEventListener('click', () => {
                track('share_map');
                const url = location.href.split('#')[0] + '#m=' + encodeMap();
                navigator.clipboard.writeText(url)
                    .then(() => showSysMsg('分享連結已複製！對方開啟即載入此地圖'))
                    .catch(() => { prompt('請手動複製此連結：', url); });
            });
            document.getElementById('devGuideBtn').addEventListener('click', () => { track('open_dev_guide'); buildDevGuide(); });
            // 預設分頁＝景點：模擬器的頭條數字是 N/29，預設分頁要和工具的主題一致
            document.getElementById('handbookBtn').addEventListener('click', () => buildHandbook('spots'));
            document.getElementById('compareBtn').addEventListener('click', () => { track('open_compare'); buildCompare(); });
            document.getElementById('reportBody').addEventListener('click', (e) => {
                const b = e.target.closest('.hb-tab');
                if (b) { buildHandbook(b.dataset.hb, true); return; }
                if (e.target.closest('#hbClearBtn')) {
                    // 觸控沒有 Esc，這顆 ✕ 是唯一的清除出口
                    const inp = document.getElementById('hbFilter');
                    if (inp) { inp.value = ''; hbFilter(''); inp.focus(); }
                    return;
                }
                // 一週後如果「老師」的點擊遠超其他，那就是資料在說該有第四個分頁
                const out = e.target.closest('.hb-out');
                if (out) track('handbook_out', { cat: out.dataset.out });
            });
            // 速查表的篩選（事件委派：輸入框是每次換分頁重建的）。去抖動比照面板搜尋的 120ms。
            let hbFilterTimer = null;
            document.getElementById('reportBody').addEventListener('input', (e) => {
                if (e.target.id !== 'hbFilter') return;
                const v = e.target.value;
                clearTimeout(hbFilterTimer);
                hbFilterTimer = setTimeout(() => hbFilter(v), 120);
            });
            document.getElementById('reportBody').addEventListener('keydown', (e) => {
                if (e.target.id !== 'hbFilter' || e.key !== 'Escape') return;
                // Esc 兩段式：框內有字→清空並吃掉這一鍵（不然 document 的 handler 會順手關窗）；
                // 框內空→讓它冒泡去關 modal（照面板搜尋既有的慣例）
                if (e.target.value) { e.stopPropagation(); e.target.value = ''; hbFilter(''); }
            });
            document.getElementById('reportCloseBtn').addEventListener('click', closeReport);
            document.getElementById('reportModal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('reportModal')) closeReport();
            });

            // 常駐摘要：數字本身就是明細入口；「差一項」晶片點了就選取該設施並亮出位置
            document.getElementById('spotSummaryBtn').addEventListener('click', () => { track('open_report'); buildSpotDetail(); });
            document.getElementById('blockedBtn').addEventListener('click', () => {
                if (!lastHasGate) { showSysMsg('先在地圖上放一個校門，才能計算動線', true); return; }
                if (toggleFlow(true) && lastBlockedFirst) focusCell(lastBlockedFirst[0], lastBlockedFirst[1]);
            });
            // 來源徽章：整列可點 → 開 🆚 比較（預設就是「原始 vs 目前」，含回到原始狀態）
            document.getElementById('originBtn').addEventListener('click', () => {
                track('open_origin', { kind: origin ? origin.kind : 'none' });
                buildCompare();
            });
            // 差異列：狀態讀數本身就是圖層開關（同 blockedBtn 的慣例）
            document.getElementById('diffBtn').addEventListener('click', toggleDiff);
            document.getElementById('nearChips').addEventListener('click', (e) => {
                if (e.target.closest('#nearMoreBtn')) {
                    nearExpanded = !nearExpanded;
                    renderSpotStats(lastSpotStats.activeIds, lastSpotStats.nearMap);
                    return;
                }
                const btn = e.target.closest('.near-chip');
                if (!btn) return;
                if (btn.dataset.tool === 'slope') {
                    showSysMsg('斜坡無法手動放置：把相鄰地形畫成相差一層的高地，交界會自動變成斜坡');
                    return;
                }
                selectTool(btn.dataset.tool);
                document.getElementById(`tool-${btn.dataset.tool}`)?.scrollIntoView({ block: 'nearest' });
                showSysMsg(`藍框＝放「${items[btn.dataset.tool].name}」即成立景點的位置。三項條件必須在同一個 4×4 範圍內，較遠處的同種設施不算數。`);
            });

            // 手機：建築面板標題列＝資訊卡的收合／展開（狀態存 body class，重繪時保留）
            document.getElementById('thToggle').addEventListener('click', () => {
                document.body.classList.toggle('th-open');
                updateToolHint(currentTool, updateSuggestions());
            });

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    // 決策對話框的 Esc＝取消（唯一什麼都不做的出口，與點背景一致）
                    if (askState) { closeAsk(false); return; }
                    if (!document.getElementById('reportModal').classList.contains('hidden')) { closeReport(); return; }
                    closePops();
                    return;
                }
                if (!(e.ctrlKey || e.metaKey)) return;
                const k = e.key.toLowerCase();
                if (k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
                else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); redo(); }
            });

            document.getElementById('diamondBtn').addEventListener('click', () => {
                const on = document.body.classList.toggle('diamond');
                track('toggle_diamond', { on });
                const btn = document.getElementById('diamondBtn');
                btn.classList.toggle('bg-indigo-600', on);
                btn.classList.toggle('text-white', on);
                savePrefs({ diamond: on });
                fitGrid();
            });

            // ─── 城鎮面板（地形／尺寸／空白畫布的唯一入口）───
            document.getElementById('townBtn').addEventListener('click', () => {
                const pop = document.getElementById('townPop');
                const willOpen = pop.classList.contains('hidden');
                closePops();
                if (willOpen) { renderTownPanel(); pop.classList.remove('hidden'); }
            });
            document.getElementById('townPop').addEventListener('click', (e) => {
                const size = e.target.closest('.town-size');
                if (size) {
                    const p = PRESETS[size.dataset.town];
                    closePops();
                    if (p) changeGridSizeTo(p.rows, p.cols);
                    return;
                }
                const row = e.target.closest('.town-row');
                if (row) {
                    const key = row.dataset.town, p = PRESETS[key];
                    closePops();
                    if (!p) return;
                    // 點目前那一鎮＝重新載入該地形（可重複執行，用來把地形重置回原樣）
                    guardDestructive(`切換到「${p.name}」會換成該鎮的地形`, () => loadPreset(key));
                    return;
                }
                if (e.target.closest('.clear-row')) {
                    closePops();
                    guardDestructive('清成空白畫布會刪掉地圖上所有內容', clearMap);
                }
            });

            // ─── 讀取面板（存檔清單＋貼上載入，同一組破壞性讀取共用一個守衛）───
            document.getElementById('loadBtn').addEventListener('click', () => {
                const pop = document.getElementById('loadPop');
                const willOpen = pop.classList.contains('hidden');
                document.getElementById('townPop').classList.add('hidden');
                if (willOpen) { renderLoadPanel(); pop.classList.remove('hidden'); }
                else pop.classList.add('hidden');
            });
            document.getElementById('loadPop').addEventListener('click', (e) => {
                const del = e.target.closest('.save-del');
                if (del) {
                    const name = del.dataset.name;
                    if (!confirm(`確定刪除存檔「${name}」？此動作無法復原。`)) return;
                    try {
                        track('delete_map');
                        const maps = JSON.parse(localStorage.getItem('pa2_maps_v9')) || {};
                        delete maps[name];
                        localStorage.setItem('pa2_maps_v9', JSON.stringify(maps));
                        renderLoadPanel();
                        showSysMsg(`已刪除：${name}`);
                    } catch (err) { showSysMsg('刪除失敗！', true); }
                    return;
                }
                const ren = e.target.closest('.save-ren');
                if (ren) {
                    const name = ren.dataset.name;
                    const input = prompt(`將「${name}」改名為：`, name);
                    const newName = input && input.trim();
                    if (!newName || newName === name) return;
                    try {
                        const maps = JSON.parse(localStorage.getItem('pa2_maps_v9')) || {};
                        if (maps[newName]) { showSysMsg('已有同名存檔！', true); return; }
                        maps[newName] = maps[name];
                        delete maps[name];
                        localStorage.setItem('pa2_maps_v9', JSON.stringify(maps));
                        renderLoadPanel();
                        if (document.getElementById('saveName').value === name) {
                            document.getElementById('saveName').value = newName;
                        }
                        if (prefs.lastSave === name) savePrefs({ lastSave: newName });
                        showSysMsg(`已改名：${newName}`);
                    } catch (err) { showSysMsg('改名失敗！', true); }
                    return;
                }
                const row = e.target.closest('.save-row');
                if (row) {
                    const name = row.dataset.name;
                    closePops();
                    guardDestructive(`讀取「${name}」會換掉目前的畫布`, () => loadSavedMap(name));
                    return;
                }
                if (e.target.closest('#pasteLoadBtn')) {
                    const box = document.getElementById('pasteBox');
                    const text = box ? box.value : '';
                    if (!text.trim()) { showSysMsg('請先貼上分享連結或代碼', true); return; }
                    closePops();
                    guardDestructive('載入貼上的地圖會換掉目前的畫布', () => loadFromText(text));
                }
            });

            document.getElementById('saveLocalBtn').addEventListener('click', () => {
                saveMapAs(document.getElementById('saveName').value.trim() || townLabel() || '未命名');
            });

            // ─── 破壞性動作的對話框 ───
            document.getElementById('askCancel').addEventListener('click', () => closeAsk(false));
            document.getElementById('askDiscard').addEventListener('click', () => {
                // 使用者明知會丟：這一步之後畫布視為「已落地」，不再重複追問
                baseline = canonGrid(gridData);
                closeAsk(true);
            });
            document.getElementById('askSave').addEventListener('click', () => {
                if (saveMapAs(document.getElementById('askName').value.trim())) closeAsk(true);
            });
            document.getElementById('askName').addEventListener('keydown', (e) => {
                if (e.key === 'Enter') { e.preventDefault(); document.getElementById('askSave').click(); }
            });
            document.getElementById('askModal').addEventListener('click', (e) => {
                if (e.target === document.getElementById('askModal')) closeAsk(false);
            });

            // ─── 手機：次要控制的 ⋯ 面板 ───
            document.getElementById('moreBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                document.getElementById('townPop').classList.toggle('hidden', true);
                document.body.classList.toggle('sheet-open');
            });
            // 點面板外面就收起（面板與觸發鈕以外的任何點擊）
            document.addEventListener('click', (e) => {
                if (!e.target.closest('#townBtn, #townPop')) document.getElementById('townPop').classList.add('hidden');
                if (!e.target.closest('#loadBtn, #loadPop')) document.getElementById('loadPop').classList.add('hidden');
                if (!e.target.closest('#moreBtn, #hdrExtra, #loadPop')) document.body.classList.remove('sheet-open');
            });

            // 首訪提示：關掉之後高度變了，要重算網格（fitGrid 只綁在 resize 上）
            document.getElementById('introClose').addEventListener('click', () => {
                document.getElementById('introTip').classList.add('hidden');
                savePrefs({ introDone: 1 });
                fitGrid();
            });
        }

        // 面板／sheet 的統一收起
        function closePops() {
            const t = document.getElementById('townPop'), l = document.getElementById('loadPop');
            if (t) t.classList.add('hidden');
            if (l) l.classList.add('hidden');
            document.body.classList.remove('sheet-open');
        }
    </script>
    <script src="../../../assets/shell.js?v=8"></script>
    <!-- mountBar() 不像 Shell.mount() 會自己送 page_engage → 這裡補一行，
         sim 才有「進來的人」這個分母（Shell.game 在 mountBar 裡才設，順序不能顛倒）。 -->
    <script data-shell>Shell.mountBar();Shell.track('page_engage', { page: 'sim' });</script>
</body>
</html>
