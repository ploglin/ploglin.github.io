    <style>
        :root { --tile: 35px; --axis: 22px; }

        body {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #333;
            overflow: hidden; 
        }

        .map-container {
            position: relative;
            flex-shrink: 0; /* main 是直向 flex:放大後高度超過視窗時不能被壓縮,否則上緣捲不到 */
            overflow: auto;
            overscroll-behavior: contain; /* 雙指平移到邊界時不連鎖成整頁捲動/下拉重整 */
            border-radius: 8px;
            background-color: #ffffff;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            width: fit-content;
            max-width: 100%;
            max-height: calc(100vh - 80px);
            margin: 0 auto;
        }

        .game-grid {
            touch-action: none; /* 觸控畫圖時不捲動頁面 */
            display: grid;
            /* 24 columns + 2 axis columns (Left/Right) */
            grid-template-columns: var(--axis) repeat(24, var(--tile)) var(--axis);
            /* 26 rows + 2 axis rows (Top/Bottom) */
            grid-template-rows: var(--axis) repeat(26, var(--tile)) var(--axis);
            gap: 1px;
            background-color: #d1d5db;
            border: 2px solid #9ca3af;
            width: fit-content;
        }

        .axis-label {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(var(--axis) * 0.45);
            color: #4b5563;
            font-family: 'Inter', monospace;
            background-color: #f3f4f6;
            font-weight: 800;
            user-select: none;
        }

        .tile {
            width: var(--tile);
            height: var(--tile);
            background-color: #bbf7d0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(var(--tile) * 0.42);
            font-weight: bold;
            color: rgba(0,0,0,0.8);
            user-select: none;
            transition: transform 0.1s;
            position: relative;
            cursor: crosshair;
        }

        .tile:hover {
            opacity: 0.9;
            transform: scale(1.15);
            z-index: 30;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            border-radius: 4px;
        }

        .elevation-2 {
            border-top: 3px solid #b45309;
            border-left: 3px solid #d97706;
            filter: brightness(0.95);
            box-shadow: inset -2px -2px 4px rgba(0,0,0,0.1);
        }

        .elevation-3 {
            border-top: 3px solid #7c2d12;
            border-left: 3px solid #9a3412;
            filter: brightness(0.88);
            box-shadow: inset -3px -3px 5px rgba(0,0,0,0.2);
        }

        /* 自動斜坡：高低差交界（高的那格）以斜紋標示 */
        .tile.slope-tile {
            background-image: repeating-linear-gradient(45deg, rgba(146, 64, 14, 0.35) 0 3px, transparent 3px 8px);
        }

        /* 搜尋定位：聚光燈式——搜尋中在整張地圖上蓋「一層」半透明白幕（單一元素，
           不對幾百個格子各自套 filter，避免合成層爆量卡頓），
           命中的格子用 z-index 浮到幕之上，保持全彩＋脈動外框 */
        .game-grid { position: relative; }
        body.searching .game-grid::after {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(248, 250, 252, 0.78);
            z-index: 9;
            pointer-events: none;
        }
        .tile.found {
            position: relative;
            outline: 3px solid #a21caf;
            outline-offset: -1px;
            /* 只有一圈細框在 35px 的格子上不夠顯眼（要跟紅框、預覽框競爭），
               再壓一層半透明底色，讓「有蓋」是一塊面而不是一條線 */
            box-shadow: inset 0 0 0 99px rgba(162, 28, 175, .16);
            z-index: 15;
            /* 只閃 3 下就停:無限脈動會逼瀏覽器每個影格重繪整個區域,造成持續卡頓 */
            animation: foundPulse 1.1s ease-in-out 3;
        }
        /* 定位跳轉：點序號徽章時把那一棟閃三下。
           .found 是「這一類全部」、.locate 是「你現在跳到的這一個」，
           顏色刻意與 .fp-preview（多格放置預覽）分開，不共用琥珀色。 */
        .tile.locate {
            outline: 4px solid #0891b2;
            outline-offset: -1px;
            z-index: 17;
            animation: locatePulse .5s steps(2, end) 3;
        }
        @keyframes locatePulse {
            0%, 100% { outline-color: #0891b2; }
            50% { outline-color: #fff; }
        }
        /* 序號徽章：位置用「地圖上標號」交代，不用座標清單（那是機器格式）。
           `--tile` 最小約 35px，所以徽章壓在左上角、18px、深底白字最好認。 */
        .found-num {
            position: absolute;
            top: -3px; left: -3px;
            z-index: 18;
            min-width: 18px; height: 18px;
            padding: 0 3px;
            border: 1px solid #fff;
            border-radius: 4px;
            background: #86198f;
            color: #fff;
            font-size: 11px;
            font-weight: 900;
            line-height: 16px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(0, 0, 0, .35);
        }
        .found-num:hover { background: #a21caf; transform: scale(1.15); }
        /* 菱形視角下整個 grid 轉 45°，徽章要反轉回來才讀得出數字 */
        body.diamond .found-num { transform: rotate(-45deg); }
        body.diamond .found-num:hover { transform: rotate(-45deg) scale(1.15); }
        /* 定位模式：景點相關的覆蓋層一律不顯示（JS 已在源頭 guard，這裡是保險） */
        body.locating .spot-indicators,
        body.locating .spot-area-ov,
        body.locating .spot-tooltip { display: none !important; }
        /* 搜尋／點選的命中摘要：原本是 11px 的一行小字，看不清楚 */
        #searchHits { font-size: 12px; line-height: 1.5; }
        #searchHits .sh-sum { display: block; font-weight: 900; font-size: 13px; }
        #searchHits .sh-hint { display: block; font-size: 11px; font-weight: 600; color: #9ca3af; margin-top: 1px; }
        /* 中間影格原本是 #fbbf24 ＝ 景點黃（ring-yellow-400）——命中外框每 1.1 秒
           會有一瞬間變成景點色，語意剛好相反。改成同色相的深淺之間。 */
        @keyframes foundPulse {
            0%, 100% { outline-color: #a21caf; }
            50% { outline-color: #e879f9; }
        }

        .palette-item {
            cursor: pointer;
            transition: all 0.2s;
        }
        .palette-item.active {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-color: #3b82f6 !important;
            border-width: 2px;
            background-color: #eff6ff;
        }

        /* 多格建築放置預覽：橘色實線框 */
        .tile.fp-preview {
            outline: 2px solid #f59e0b;
            outline-offset: -2px;
            z-index: 15;
        }
        .tile.fp-preview::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(245, 158, 11, 0.25);
            pointer-events: none;
            z-index: 4;
        }

        /* 菱形（等角）視角：整個網格旋轉 45°，文字反向轉回維持直立 */
        body.diamond .map-container {
            overflow: visible;
            max-height: none;
            max-width: none; /* 放大時不截斷，讓外層 main 捲動可及整張圖 */
            background: transparent;
            box-shadow: none;
        }
        body.diamond .game-grid {
            position: absolute;
            top: 50%;
            left: 50%;
            /* 逆時針轉 45°（讓 [X2,Y2] 角朝上）再垂直壓一半 → 與遊戲相同的 2:1 等角地磚 */
            transform: translate(-50%, -50%) scaleY(0.5) rotate(-45deg);
        }
        body.diamond .axis-label,
        body.diamond .tile .content-span {
            /* 反向變形，讓文字保持直立且不變形 */
            transform: rotate(45deg) scaleY(2);
        }
        body.diamond .spot-tooltip {
            transform: translateX(-50%) rotate(45deg) scaleY(2);
        }

        /* 觸控裝置：縮放列是放大後「一定找得到」的逃生口，命中區要滿 44px（視覺方塊維持小） */
        @media (pointer: coarse) {
            #zoomOutBtn, #zoomInBtn, #zoomResetBtn {
                position: relative;
                min-width: 28px;
                min-height: 28px;
            }
            #zoomOutBtn::after, #zoomInBtn::after, #zoomResetBtn::after {
                content: '';
                position: absolute;
                top: 50%; left: 50%;
                width: 44px; height: 44px;
                transform: translate(-50%, -50%);
            }
        }

        /* 矩形工具預覽：靛藍框 */
        .tile.rect-preview {
            outline: 2px solid #6366f1;
            outline-offset: -2px;
        }
        .tile.rect-preview::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(99, 102, 241, 0.25);
            pointer-events: none;
            z-index: 4;
        }

        /* 無法進入的設施：紅框警告（四周被建築完全包圍） */
        .tile.blocked {
            outline: 2px solid #dc2626;
            outline-offset: -2px;
        }

        /* 次佳建議：天藍點狀框（放置後只差一項其他條件） */
        .tile.suggest2::after {
            content: '';
            position: absolute;
            inset: 1px;
            border: 2px dotted #0ea5e9;
            border-radius: 4px;
            background: rgba(14, 165, 233, 0.12);
            pointer-events: none;
            z-index: 5;
        }

        /* 建議放置位置：藍色虛線框 */
        .tile.suggest::after {
            content: '';
            position: absolute;
            inset: 1px;
            border: 2px dashed #2563eb;
            border-radius: 4px;
            background: rgba(59, 130, 246, 0.18);
            pointer-events: none;
            z-index: 5;
            animation: suggestPulse 1.2s ease-in-out infinite;
        }
        @keyframes suggestPulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 1; }
        }

        .spot-tooltip {
            position: absolute;
            bottom: 110%;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 255, 255, 0.98);
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 8px 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
            z-index: 50;
            width: max-content;
            max-width: 220px;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.15s;
        }
        .tile:hover .spot-tooltip {
            opacity: 1;
            visibility: visible;
        }
        .spot-tooltip::after {
            content: '';
            position: absolute;
            top: 100%; left: 50%; margin-left: -6px;
            border-width: 6px; border-style: solid;
            border-color: rgba(255, 255, 255, 0.98) transparent transparent transparent;
        }

        /* ── 收斂後的頂列與面板 ──
           頂列只留「最常用＋反映狀態」的控制，其餘（工具模式／圖層／存檔／分享）
           在桌機是同一列的次要叢集、在手機收進 ⋯ 面板。 */
        #moreBtn, #thToggle { display: none; }
        #hdrExtra { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

        /* 彈出面板（城鎮／讀取存檔）：清單式，每一列都可點，
           取代「選一個下拉、再從幾顆動詞按鈕裡猜一顆」的舊模式。 */
        .pop {
            position: absolute;
            top: 100%;
            margin-top: 6px;
            width: 268px;
            max-height: min(70vh, 460px);
            overflow-y: auto;
            border-radius: 10px;
            padding: 6px;
            box-shadow: 0 14px 28px -8px rgba(0, 0, 0, .3);
            z-index: 55;
        }
        .pop-row {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            text-align: left;
            padding: 7px 8px;
            border-radius: 7px;
            font-size: 12px;
            line-height: 1.35;
        }
        /* 右側的面板往左掛，才不會超出視窗右緣 */
        #loadPop { right: 0; }
        .pop-sep { margin: 5px 4px; border-top: 1px solid; opacity: .5; }

        /* 景點進度條：常駐摘要的「一眼」編碼（數字負責精確）。
           軌道用已映射的 bg-gray-200；填色是介面 chrome（不是地圖內容），
           所以兩套深色區塊都補了 .prog-fill 的深色版。 */
        .prog { height: 4px; border-radius: 2px; overflow: hidden; }
        .prog-fill { display: block; height: 100%; transition: width .25s ease; background: #16a34a; }

        /* 「差一項」晶片：常駐摘要裡的主要行動 → 做成真的可點晶片，
           觸控裝置用 ::after 把命中區補到 44px（視覺方塊維持小）。 */
        .near-chip { position: relative; }
        @media (pointer: coarse) {
            .near-chip::after {
                content: '';
                position: absolute;
                top: 50%; left: 50%;
                min-width: 44px; min-height: 44px;
                width: 100%; height: 100%;
                transform: translate(-50%, -50%);
            }
        }

        /* 清除工具的「整棟拆除」預覽：紅色虛線＋交叉斜紋。
           刻意不用 .blocked 的實線紅框（那代表「被包圍、不可用」），
           同一張圖上同一種紅不該指兩件事。預覽本身就是說明，不再加文字。 */
        .tile.fp-raze { outline: 2px dashed #b91c1c; outline-offset: -2px; z-index: 16; }
        .tile.fp-raze::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(45deg, rgba(185, 28, 28, .38) 0 3px, transparent 3px 7px);
            pointer-events: none;
            z-index: 4;
        }

        /* ─── 差異圖層：「現在」對「來源」的三態 ───
           三態以**字符**為主通道、顏色為輔。理由有兩個：㈠ 地圖上的色相已經被
           .blocked（實線紅框）、.suggest（藍虛線）、.fp-preview（琥珀）、.found（洋紅）、
           動線（綠→紅色階）佔滿，再加一組純色編碼一定撞語意；㈡ 純色彩編碼在色弱下失效。
           字符放**右下角**：右上角是景點指示點（.spot-indicators，-top-1 -right-1 z-20）、
           左上角是序號徽章（.found-num），只有右下角是空的。
           色洗做成子元素（比照 .flow-ov）而不是 box-shadow —— updateTileVisuals() 會寫
           inline boxShadow，class 的 box-shadow 在有設施的格子上會被它蓋掉。
           z-index 6：壓在建議框（5）與景點面色（3）之上（正在調查的圖層要在上），
           仍在 .content-span（10）之下，設施標籤不被遮。 */
        .diff-ov { position: absolute; inset: 0; pointer-events: none; z-index: 6; }
        .diff-ov.d-add { background: rgba(5, 150, 105, .22); }
        .diff-ov.d-chg { background: rgba(124, 58, 237, .22); }
        /* 「拆掉」刻意不用紅：.blocked 的紅框在差異圖層開著時仍然存在（它是錯誤、不是景點
           通道），而 🆚 比較 的縮圖也已經用紅框表示「這一格有差異」。石板灰讀起來就是
           「這裡原本有東西、現在是缺口」，比紅更準。 */
        .diff-ov.d-del { background: rgba(51, 65, 85, .26); }
        .diff-mark {
            position: absolute;
            right: 0; bottom: -2px;
            line-height: 1;
            font-weight: 900;
            font-style: normal;
            font-size: max(8px, calc(var(--tile) * .34));
            /* 不做成帶框徽章：重鋪一次走廊就有幾十格變更，幾十個徽章會變成徽章牆。
               純字符＋白描邊在任何格子底色上都讀得出來，密集時仍讀成「一片標記」。 */
            text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 2px #fff;
        }
        .d-add .diff-mark { color: #065f46; }
        .d-del .diff-mark { color: #1e293b; }
        .d-chg .diff-mark { color: #5b21b6; }
        /* 菱形視角下整個 grid 轉 45°，字符要反轉回來才讀得出（比照 .found-num） */
        body.diamond .diff-mark { transform: rotate(-45deg); }
        /* 差異圖層開著時的建議框：源頭已 guard（updateSuggestions 照算不畫），這裡是保險。
           刻意**不**連景點標記一起藏 —— 見 JS 端 diffActive() 的註解。 */
        body.diffing .tile.suggest, body.diffing .tile.suggest2 { outline: none !important; }
        /* 右軌狀態列的開關（來源／差異）：整列可點，觸控裝置補到 44px 命中高度。
           圖層開啟時要有視覺 on 態 —— 只換文字的話，捲了調色盤回來會分不出

            <div class="shrink-0 px-3 pt-2.5 pb-2 border-b border-gray-200">

        let gridRows = 26; // X: 2 起，由上而下

        /* 快照連 origin（來源徽章的來歷＋原始地形）一起存：載入類動作都會 pushHistory()，

        function snapshot() { return JSON.stringify({ g: gridData, o: origin }); }

        function pushHistory() {
            undoStack.push(snapshot());
            if (undoStack.length > HISTORY_MAX) undoStack.shift();
            redoStack.length = 0;
            updateHistoryButtons();

        function restoreSnapshot(json) {

            if (parsed.length !== gridRows || (parsed[0] && parsed[0].length !== gridCols)) {
                setGridSize(parsed.length, parsed[0].length, false);
            }
            gridData = parsed;

        function setGridSize(rows, cols, preserve) {
            rows = Math.max(5, Math.min(40, rows | 0));
            cols = Math.max(5, Math.min(40, cols | 0));

            const old = gridData;
            gridData = Array(rows).fill(null).map((_, r) => Array(cols).fill(null).map((_, c) => {
                if (preserve && old[r] && old[r][c]) return old[r][c];
                return { type: 'empty', elevation: 1 };
            }));
            gridRows = rows; gridCols = cols;
            renderGrid();
            fitGrid();
            assignBlockIds();
            for (let r = 0; r < gridRows; r++) for (let c = 0; c < gridCols; c++) updateTileVisuals(r, c);
            checkSpots();
            updateTownLabel();  // 城鎮鈕的字樣就是狀態（含「自訂 R×C」），尺寸一變就要跟上
        }

        /* 只換尺寸、保留已畫內容（城鎮面板的次要動作）。
           臨摹族的用途：先照著遊戲畫在 26×24 上，事後發現自己玩的是 26×26 的溪谷。
           縮小會裁掉超界格，所以先確認。 */
        function changeGridSizeTo(rows, cols) {
            if (rows === gridRows && cols === gridCols) return;
            let lost = 0;
            for (let r = 0; r < gridRows; r++) for (let c = 0; c < gridCols; c++) {
                if ((r >= rows || c >= cols) && gridData[r][c].type !== 'empty') lost++;
            }
            if (lost && !confirm(`縮小到 ${rows}×${cols} 會裁掉 ${lost} 格已放置的內容，確定？`)) return;
            pushHistory();
            setGridSize(rows, cols, true);
            showSysMsg(`地圖尺寸已切換為 ${rows}×${cols}（內容保留）`);
            track('grid_resize', { size: rows + 'x' + cols });
        }

        function undo() {
            if (!undoStack.length) { showSysMsg('沒有可復原的步驟', true); return; }
            redoStack.push(snapshot());
            restoreSnapshot(undoStack.pop());
            updateHistoryButtons();
        }

        function redo() {
            if (!redoStack.length) { showSysMsg('沒有可重做的步驟', true); return; }
            undoStack.push(snapshot());
            restoreSnapshot(redoStack.pop());
            updateHistoryButtons();
        }

        function updateHistoryButtons() {
            const u = document.getElementById('undoBtn'), rd = document.getElementById('redoBtn');
            if (!u || !rd) return;
            u.classList.toggle('opacity-40', !undoStack.length);
            rd.classList.toggle('opacity-40', !redoStack.length);
        }

        // ─── 偏好記憶與自動儲存 ───
        const PREFS_KEY = 'pa2_prefs_v1', AUTOSAVE_KEY = 'pa2_autosave_v1';
        let prefs = {};
        try { prefs = JSON.parse(localStorage.getItem(PREFS_KEY)) || {}; } catch (e) { prefs = {}; }
        function savePrefs(patch) {
            Object.assign(prefs, patch);
            try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch (e) {}
        }

        // ─── 地圖縮放/平移 ───
        // zoomLevel=1 表示「剛好塞滿視窗」(fitGrid 的自動尺寸);放大後 map-container
        // 以原生 overflow:auto 捲動平移(滾輪/捲軸/滑鼠中鍵拖曳)。倍率跨次記憶。
        let zoomLevel = Math.min(3, Math.max(0.5, parseFloat(prefs.zoom) || 1));
        // 實際會捲動的那層:正常視角是 map-container(overflow:auto);
        // 斜視模式容器 overflow:visible,捲動的是外層 main
        function mapScroller() {
            return document.body.classList.contains('diamond') ? document.querySelector('main') : document.getElementById('mapContainer');
        }
        // transient=true：手勢進行中的即時縮放，不寫 localStorage（捏合每帧同步寫入會頓）
        function setZoom(z, anchor, transient) {
            z = Math.min(3, Math.max(0.5, z));
            const cont = mapScroller();
            // 以錨點(預設容器中心)為中心縮放:記住錨點在內容中的比例,縮放後把捲動位置補回去
            let ax = 0.5, ay = 0.5, px = 0, py = 0;
            if (cont) {
                const rect = cont.getBoundingClientRect();
                px = anchor ? anchor.x - rect.left : rect.width / 2;
                py = anchor ? anchor.y - rect.top : rect.height / 2;
                ax = (cont.scrollLeft + px) / Math.max(1, cont.scrollWidth);
                ay = (cont.scrollTop + py) / Math.max(1, cont.scrollHeight);
            }
            zoomLevel = z;
            if (!transient) savePrefs({ zoom: +z.toFixed(2) });
            fitGrid();
            if (cont) {
                cont.scrollLeft = ax * cont.scrollWidth - px;
                cont.scrollTop = ay * cont.scrollHeight - py;
            }
            const label = document.getElementById('zoomResetBtn');
            if (label) {
                label.innerText = Math.round(zoomLevel * 100) + '%';
                // 它是可按的（回 100%），但無底無框會被當成狀態顯示 → 非 100% 時給它底色
                label.classList.toggle('bg-gray-200', Math.abs(zoomLevel - 1) > 0.01);
            }
            // 觸控裝置：不知道能雙指平移的人會陷在放大後的視野裡，第一次放大時提示一次
            if (!transient && zoomLevel > 1 && !prefs.panHint &&
                window.matchMedia && matchMedia('(pointer: coarse)').matches) {
                savePrefs({ panHint: 1 });
                showSysMsg('雙指拖曳可平移地圖、捏合可縮放');
            }
        }

        // 摘要與明細用的最近一次計算結果（都由 checkSpots／updateAccessWarnings 更新）
        let lastSpotStats = { activeIds: new Set(), nearMap: new Map() };
        let lastBlockedCount = 0;
        let lastHasGate = false;       // 地圖上有沒有校門（沒有＝動線無法檢查，不等於沒問題）
        let lastBlockedFirst = null;   // 第一棟走不到的建築位置（給摘要的「點看動線」跳過去）
        let lastBuildingGroups = 0;    // 地圖上的設施棟數（還沒蓋東西時不必嘮叨校門）

        // ─── 繪製模式（筆刷／矩形填滿）───
        let rectMode = false, rectStart = null, rectEnd = null;

        function styleModeBtns() {
            const on = 'px-2 py-1 text-[11px] font-bold rounded bg-white text-gray-800 shadow-sm transition';
            const off = 'px-2 py-1 text-[11px] font-bold rounded text-gray-500 hover:text-gray-800 transition';
            const b = document.getElementById('brushBtn'), r = document.getElementById('rectBtn');
            if (b) b.className = rectMode ? off : on;
            if (r) r.className = rectMode ? on : off;
        }
        function setDrawMode(rect) {
            if (rectMode === rect) return;
            rectMode = rect;
            track('toggle_rect', { on: rectMode });
            styleModeBtns();
            showSysMsg(rectMode
                ? '矩形模式：拖曳框選範圍一次填滿（限 1×1 項目；按住 Shift 拖曳也可以）'
                : '筆刷模式：拖曳逐格畫');
        }

        function previewRect() {
            document.querySelectorAll('.tile.rect-preview').forEach(t => t.classList.remove('rect-preview'));
            if (!rectStart || !rectEnd) return;
            const r1 = Math.min(rectStart.r, rectEnd.r), r2 = Math.max(rectStart.r, rectEnd.r);
            const c1 = Math.min(rectStart.c, rectEnd.c), c2 = Math.max(rectStart.c, rectEnd.c);
            for (let r = r1; r <= r2; r++) {
                for (let c = c1; c <= c2; c++) {
                    const el = tileAt(r, c);
                    if (el) el.classList.add('rect-preview');
                }
            }
        }

        function commitRect() {
            const r1 = Math.min(rectStart.r, rectEnd.r), r2 = Math.max(rectStart.r, rectEnd.r);
            const c1 = Math.min(rectStart.c, rectEnd.c), c2 = Math.max(rectStart.c, rectEnd.c);
            // 與 applyTool 同一個理由：矩形填滿只蓋到多格建築的一部分也會留下殘格
            const razed = razeUnder(r1, c1, c2 - c1 + 1, r2 - r1 + 1);
            for (let r = r1; r <= r2; r++) {
                for (let c = c1; c <= c2; c++) {
                    gridData[r][c] = { type: currentTool, elevation: currentElevation };
                }
            }
            // 連同外圍一圈重繪（鄰接建築的合併縫隙會受影響）
            for (let r = Math.max(0, r1 - 1); r <= Math.min(gridRows - 1, r2 + 1); r++) {
                for (let c = Math.max(0, c1 - 1); c <= Math.min(gridCols - 1, c2 + 1); c++) {
                    updateTileVisuals(r, c);
                }
            }
            if (razed) {
                for (const [rr, cc] of razed.cells) {
                    for (let dr = -1; dr <= 1; dr++) {
                        for (let dc = -1; dc <= 1; dc++) {
                            const nr = rr + dr, nc = cc + dc;
                            if (nr >= 0 && nr < gridRows && nc >= 0 && nc < gridCols) updateTileVisuals(nr, nc);
                        }
                    }
                }
                showSysMsg(`已拆除 ${razed.label}`);
            }
            rectStart = rectEnd = null;
            document.querySelectorAll('.tile.rect-preview').forEach(t => t.classList.remove('rect-preview'));
            checkSpots();
        }

        // ─── 分享連結：把地圖 RLE 壓縮成 base64url 放進網址 hash ───
        // 注意：TYPE_KEYS 依 items 定義順序，新增設施務必 append 在該分類尾端，避免舊連結失效
        const TYPE_KEYS = Object.keys(items);

        function encodeMap() {
            const parts = [];
            let prev = null, count = 0;
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    const cell = gridData[r][c];
                    const key = TYPE_KEYS.indexOf(cell.type) + '.' + (cell.elevation || 1);
                    if (key === prev) { count++; }
                    else {
                        if (prev !== null) parts.push(prev + '.' + count);
                        prev = key; count = 1;
                    }
                }
            }
            if (prev !== null) parts.push(prev + '.' + count);
            // 非預設尺寸（健康鎮 26×24）時在最前面帶尺寸；26×24 維持無前綴，
            // 舊分享連結與外部產生器完全相容。
            const prefix = (gridRows === 26 && gridCols === 24) ? '' : gridRows + 'x' + gridCols + ';';
            return btoa(prefix + parts.join(',')).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        }

        function decodeMap(code) {
            try {
                let str = atob(code.replace(/-/g, '+').replace(/_/g, '/'));
                // 選用的尺寸前綴「RxC;」；沒有 = 舊格式 26×24
                let rows = 26, cols = 24;
                const sm = /^(\d+)x(\d+);/.exec(str);
                if (sm) { rows = +sm[1]; cols = +sm[2]; str = str.slice(sm[0].length); }
                if (rows < 5 || rows > 40 || cols < 5 || cols > 40) return null;
                const cells = [];
                for (const p of str.split(',')) {
                    const [t, e, n] = p.split('.').map(Number);
                    for (let k = 0; k < n; k++) cells.push({ type: TYPE_KEYS[t] || 'empty', elevation: e || 1 });
                }
                if (cells.length !== rows * cols) return null;
                const grid = [];
                for (let r = 0; r < rows; r++) grid.push(cells.slice(r * cols, (r + 1) * cols));
                return grid;  // importGridData 會依陣列尺寸自動切換畫布
            } catch (err) { return null; }
        }

        function styleSuggestBtn() {
            const b = document.getElementById('suggestBtn');
            if (!b) return;
            const on = !prefs.suggestOff;
            b.classList.toggle('bg-indigo-600', on);
            b.classList.toggle('text-white', on);
        }

        let autosaveTimer;
        function scheduleAutosave() {
            clearTimeout(autosaveTimer);
            autosaveTimer = setTimeout(() => {
                try { localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(gridData)); } catch (e) {}
                updateTownLabel();  // 這裡本來就要序列化整張圖，順便讓城鎮鈕的字樣跟上狀態
            }, 400);
        }

        // 依視窗大小縮放格子，讓整張地圖盡量一屏放下、不出現捲軸
        function fitGrid() {
            const main = document.querySelector('main');
            if (!main) return;
            const axis = 22, gap = 1;
            const availW = main.clientWidth - 34;
            const availH = main.clientHeight - 34;
            const diamond = document.body.classList.contains('diamond');
            let tile;
            if (diamond) {
                // 2:1 等角：外框寬 = (原寬+原高)×sin45°，高再壓一半
                const fixed = 4 * axis + gap * ((gridCols + 1) + (gridRows + 1)) + 8;
                const totalW = availW / 0.7071;
                const totalH = availH / 0.3536;
                tile = Math.floor((Math.min(totalW, totalH) - fixed) / (gridCols + gridRows));
            } else {
                const tileW = (availW - axis * 2 - gap * (gridCols + 1) - 4) / gridCols;
                const tileH = (availH - axis * 2 - gap * (gridRows + 1) - 4) / gridRows;
                tile = Math.floor(Math.min(tileW, tileH));
            }
            tile = Math.max(10, Math.min(40, tile));
            tile = Math.max(6, Math.min(120, Math.round(tile * zoomLevel)));  // 使用者縮放倍率(1=剛好塞滿)
            document.documentElement.style.setProperty('--tile', tile + 'px');
            document.documentElement.style.setProperty('--axis', axis + 'px');

            // 菱形模式：容器要撐出旋轉後的正方形外框，讓網格置中
            const container = document.getElementById('mapContainer');
            if (container) {
                if (diamond) {
                    const w = axis * 2 + gridCols * tile + gap * (gridCols + 1) + 4;
                    const h = axis * 2 + gridRows * tile + gap * (gridRows + 1) + 4;
                    const side = Math.ceil((w + h) * 0.7071);
                    container.style.width = side + 'px';
                    container.style.height = Math.ceil(side / 2) + 'px';
                } else {
                    container.style.width = '';
                    container.style.height = '';
                }
            }
        }
        window.addEventListener('resize', fitGrid);

        function updateCoordHint(r, c) {
            const cell = gridData[r][c];
            const item = items[cell.type] || items['empty'];
            const label = item.id === 'empty' ? (isSlope(r, c) ? '斜坡（自動）' : '空地') : item.name;
            const tileEl = tileAt(r, c);
            const warn = tileEl && tileEl.classList.contains('blocked') ? '　⚠ 被包圍，學生無法進入' : '';
            const elevName = cell.elevation === 3 ? '高地2層' : cell.elevation === 2 ? '高地1層' : '平地';
            /* 吸管是只活在程式碼裡的操作 → 停在有建築的格子上時，就地講一次
               （觸控裝置沒有右鍵，講「長按」）。用過一次就不再顯示：一次性學習不該變成永久裝飾。
               有 ⚠ 時讓警告贏——這條膠囊只有一行，教學不跟錯誤搶。 */
            let pick = '';
            if (!warn && !prefs.pickHint && cell.type !== 'empty') {
                pick = coarsePointer() ? '　·　長按吸取' : '　·　右鍵吸取';
            }
            const el = document.getElementById('coordHint');
            el.innerHTML = `X:${r + 2}　Y:${gridCols + 1 - c}　${esc(label)}（${elevName}）${warn}`
                + (pick ? `<span class="opacity-60">${pick}</span>` : '');
        }
        function coarsePointer() {
            return !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
        }

        /* 放置預覽：多格建築標出會占據的範圍（琥珀框）。
           清除工具停在多格建築上時，標出**整棟**會被拆掉的範圍（紅虛線＋斜紋）——
           「點一格整棟消失」原本只存在程式碼裡，預覽本身就是說明，不必加文字。 */
        let lastRazeBid = null;
        function previewFootprint(r, c) {
            const cell = gridData[r][c];
            if (currentTool === 'empty') {
                document.querySelectorAll('.tile.fp-preview').forEach(t => t.classList.remove('fp-preview'));
                const bid = cell.bid;
                if (bid === lastRazeBid) return;   // hover 逐格觸發：同一棟不重算
                lastRazeBid = bid;
                document.querySelectorAll('.tile.fp-raze').forEach(t => t.classList.remove('fp-raze'));
                if (bid === undefined) return;
                for (let rr = 0; rr < gridRows; rr++) {
                    for (let cc = 0; cc < gridCols; cc++) {
                        if (gridData[rr][cc].bid === bid) {
                            const el = tileAt(rr, cc);
                            if (el) el.classList.add('fp-raze');
                        }
                    }
                }
                return;
            }
            if (lastRazeBid !== null) {
                lastRazeBid = null;
                document.querySelectorAll('.tile.fp-raze').forEach(t => t.classList.remove('fp-raze'));
            }
            document.querySelectorAll('.tile.fp-preview').forEach(t => t.classList.remove('fp-preview'));
            const fp = getFootprint(currentTool);
            if (fp.w === 1 && fp.h === 1) return;
            for (let dr = 0; dr < fp.h; dr++) {
                for (let dc = 0; dc < fp.w; dc++) {
                    const el = tileAt(r + dr, c + dc);
                    if (el) el.classList.add('fp-preview');
                }
            }
        }

        // 依目前選取的建築，找出「放下去就能完成人氣景點」的空格並標示藍色虛線框。
        // 判定（官方 4×4 規則）：某個 4×4 視窗已集齊該景點除了選取建築外的所有條件時，
        // 只要建築佔地與該視窗有交集、且佔地全為空格，就是有效的建議位置（標示於左上角錨點格）。
        function updateSuggestions() {
            document.querySelectorAll('.tile.suggest, .tile.suggest2').forEach(t => t.classList.remove('suggest', 'suggest2'));
            const toolId = currentTool;
            if (prefs.suggestOff) return null;
            if (!toolId || toolId === 'empty') return null;
            const inGroup = g => (Array.isArray(g) ? g.includes(toolId) : g === toolId);
            // 已成立的景點不再提示（隨成立數增加，畫面才不會越來越吵）
            const relevantSpots = SPOTS.filter(s => s.req.some(inGroup) && !lastSpotStats.activeIds.has(s.id));
            if (!relevantSpots.length) return null;
            const fp = getFootprint(toolId);

            const suggest = Array(gridRows).fill(null).map(() => Array(gridCols).fill(false));
            const suggest2 = Array(gridRows).fill(null).map(() => Array(gridCols).fill(false));
            const hitSpots = new Set();
            const near = new Map(); // 放置後只差一項條件的景點 → 還缺的設施名

            for (let wr = 0; wr <= gridRows - 4; wr++) {
                for (let wc = 0; wc <= gridCols - 4; wc++) {
                    const typesIn = new Set();
                    for (let dr = 0; dr < 4; dr++) {
                        for (let dc = 0; dc < 4; dc++) {
                            const t = gridData[wr + dr][wc + dc].type;
                            if (t !== 'empty') typesIn.add(t);
                            else if (isSlope(wr + dr, wc + dc)) typesIn.add('slope');
                        }
                    }
                    relevantSpots.forEach(spot => {
                        const myGroup = spot.req.find(inGroup);
                        const others = spot.req.filter(g => g !== myGroup);
                        if (!others.length) return;
                        if ((Array.isArray(myGroup) ? myGroup : [myGroup]).some(t => typesIn.has(t))) return; // 該條件已存在
                        const unmet = others.filter(g => !(Array.isArray(g) ? g : [g]).some(t => typesIn.has(t)));
                        let target;
                        if (unmet.length === 0) {
                            hitSpots.add(spot.name);
                            target = suggest;
                        } else if (unmet.length === 1 && others.length > 1) {
                            // 次佳：這一帶已有一項其他條件，放置後只差一項
                            const missName = (Array.isArray(unmet[0]) ? unmet[0] : [unmet[0]])
                                .map(t => items[t] ? items[t].name : t).join('/');
                            near.set(spot.name, missName);
                            target = suggest2;
                        } else return;
                        // 錨點只要讓建築佔地與此 4×4 視窗有交集即可
                        for (let ar = wr - fp.h + 1; ar < wr + 4; ar++) {
                            for (let ac = wc - fp.w + 1; ac < wc + 4; ac++) {
                                if (ar >= 0 && ac >= 0 && canPlaceAllEmpty(ar, ac, fp.w, fp.h)) {
                                    target[ar][ac] = true;
                                }
                            }
                        }
                    });
                }
            }

            /* 定位模式下不畫建議框：搜尋／點選設施的目的是「看清楚這一種在哪、有幾棟」，
               同時撒滿藍色的「這裡可以湊景點」虛線框會把畫面弄花，也違背聚光燈
               （壓暗全圖只留命中）的用意。這裡只跳過**繪製**、照樣算完回傳，
               所以右下資訊卡的「可立即完成／差一項」狀態不受影響。 */
            /* 差異圖層開著時同樣只跳過**繪製**：它畫在空格上，會與「拆掉」態重複標記
               同一格，語意相反。照樣算完回傳，因為 updateToolHint() 還要吃這個回傳值
               （「可立即完成／差一項」）——使用者關掉的是藍框，不是資訊。 */
            const locating = !!hlIds || diffActive();
            let count = 0, count2 = 0;
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    if (suggest[r][c]) {
                        count++;
                        if (!locating) { const el = tileAt(r, c); if (el) el.classList.add('suggest'); }
                    }
                }
            }
            if (count === 0) { // 沒有可立即完成的位置時，才顯示次佳區域
                for (let r = 0; r < gridRows; r++) {
                    for (let c = 0; c < gridCols; c++) {
                        if (suggest2[r][c]) {
                            count2++;
                            if (!locating) { const el = tileAt(r, c); if (el) el.classList.add('suggest2'); }
                        }
                    }
                }
            }
            return { count, count2, hitSpots, near };
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderPalette();
            renderRecent();
            renderGrid();
            setupEventListeners();
            seedProgressSave();
            renderLoadPanel();

            // 還原上次的操作偏好
            if (prefs.diamond) {
                document.body.classList.add('diamond');
                const btn = document.getElementById('diamondBtn');
                btn.classList.add('bg-indigo-600', 'text-white');
            }
            if (prefs.elevation >= 2) setElevation(prefs.elevation);
            styleSuggestBtn();
            styleFlowBtn();
            styleModeBtns();
            selectTool(prefs.tool && items[prefs.tool] && !items[prefs.tool].hidden ? prefs.tool : 'grass');
            fitGrid();

            /* 載入順序：**先**還原自動存檔（或預設圖），**再**套用分享連結，而且套用前
               要過 guardDestructive()。
               原本是「分享連結優先、不經守衛、不 pushHistory」：使用者昨天改到一半沒存，
               今天回到佈局頁再點一次「🧩 在模擬器開啟」，前一天的成果就被分享碼無警告、
               無 undo、無存檔地覆蓋掉（400ms 後連 autosave 也被蓋）。那是全檔唯一沒進
               統一守衛的破壞性路徑，而它正是「載入範例 → 照著改 → 比對」這條主動線的入口。 */
            loadOriginStore();
            const shareMatch = location.hash.match(/^#m=(.+)$/);
            const pendingGrid = shareMatch ? decodeMap(shareMatch[1]) : null;
            let restored = false;
            try {
                const auto = JSON.parse(localStorage.getItem(AUTOSAVE_KEY));
                if (Array.isArray(auto)) {
                    restored = importGridData(auto);
                    if (restored) {
                        if (prefs.lastSave) document.getElementById('saveName').value = prefs.lastSave;
                        /* autosave 的來歷：內容等於 pa2_origin_v1 記下的來源 → 一個字都沒改（乾淨）；
                           等於某鎮的原始地形 → 認定為該鎮（乾淨）；否則視為「有未儲存的編輯」
                           （baseline 留 null）。城鎮鈕的字樣改用 origin 記的城鎮，
                           這樣「載入健康鎮完美佈局→關掉→重開」不會退化成「自訂 26×24」。 */
                        const town = matchTown(gridData);
                        if (origin && origin.code === encodeMap()) markClean(origin.town || town);
                        else if (town) markClean(town);
                        else { currentTownKey = (origin && origin.town) || null; updateTownLabel(); }
                        if (!pendingGrid) showSysMsg('已還原上次的編輯進度');
                    }
                }
            } catch (e) {}
            if (!restored) loadPreset('health', { quiet: !!pendingGrid });
            if (pendingGrid) applySharedGrid(shareMatch[1], pendingGrid);
            updateOriginRow();
            syncSuggestBtn();
            // 沒有可比對的來源時安靜地自我停用（使用者什麼都還沒做，不該吃一句紅字）
            if (prefs.diffOn && !originComparable()) savePrefs({ diffOn: false });
            else renderDiffOverlay();

            // 首訪一句話（不做導覽 tour）；橫幅會改變可用高度，插入與關閉都要重算網格
            if (!prefs.introDone) {
                const tip = document.getElementById('introTip');
                if (tip) { tip.classList.remove('hidden'); fitGrid(); }
            }
        });

        function showSysMsg(text, isError = false) {
            const toast = document.getElementById('sysMsgToast');
            const icon = document.getElementById('sysMsgIcon');
            const msg = document.getElementById('sysMsgText');
            clearTimeout(toastTimeout);
            icon.innerText = isError ? '❌' : '✅';
            msg.innerText = text;
            toast.className = `fixed top-4 left-1/2 transform -translate-x-1/2 px-5 py-2 rounded-full shadow-lg text-xs font-bold z-50 transition-all duration-300 pointer-events-none flex items-center gap-2 ${isError ? 'bg-red-500 text-white' : 'bg-gray-800 text-white'}`;
            void toast.offsetWidth;
            toast.classList.remove('-translate-y-20', 'opacity-0');
            toastTimeout = setTimeout(() => { toast.classList.add('-translate-y-20', 'opacity-0'); }, 2500);
        }

        // GA4 事件埋點：只記錄有意義的離散動作（不追蹤逐格塗畫）
        // 一律走 Shell.track（會自動帶 game_id/game_type）→ 行為事件與 page_engage 同口徑，
        // 才切得出「進來 sim 的人有多少真的動手」。Shell 還沒載入時退回直接打 gtag。
        let lastToolTracked = '';
        function track(name, params) {
            try {
                if (window.Shell && Shell.track) { Shell.track(name, params); return; }
                if (window.gtag) gtag('event', name, params || {});
            } catch (e) {}
        }

        function setElevation(lvl) {
            currentElevation = lvl;
            savePrefs({ elevation: lvl });
            const activeCls = { 1: 'bg-white text-gray-800 shadow-sm', 2: 'bg-amber-600 text-white shadow-sm', 3: 'bg-orange-900 text-white shadow-sm' };
            [1, 2, 3].forEach(l => {
                const b = document.getElementById(`layer${l}Btn`);
                if (b) b.className = `px-2 py-1 text-[10px] font-bold rounded transition ${l === lvl ? activeCls[l] : 'text-gray-500 hover:text-gray-800'}`;
            });
        }

        function renderPalette() {
            const containers = {
                'tool': document.getElementById('palette-tools'),
                'env': document.getElementById('palette-env'),
                'fac': document.getElementById('palette-fac'),
                'spec': document.getElementById('palette-spec'),
                'sports': document.getElementById('palette-sports'),
                'farm': document.getElementById('palette-farm')
            };

            Object.values(items).forEach(item => {
                if (item.hidden) return;
                const el = document.createElement('div');
                el.className = `palette-item flex flex-col items-center justify-center p-1.5 rounded border border-transparent bg-white shadow-sm`;
                el.id = `tool-${item.id}`;
                el.onclick = () => selectTool(item.id);
                const fpW = item.w || 1, fpH = item.h || 1;
                const jp = JP_NAMES[item.id] ? `／日文：${JP_NAMES[item.id]}` : '';
                el.title = (fpW * fpH > 1 ? `${item.name}（占地 ${fpW}×${fpH}）` : item.name) + jp;
                
                const colorBox = document.createElement('div');
                colorBox.className = 'w-6 h-6 mb-1 rounded flex items-center justify-center text-[14px] font-black shadow-inner';
                colorBox.style.backgroundColor = item.color;
                colorBox.style.color = item.textCol || 'black';
                colorBox.innerText = ITEM_ICONS[item.id] || item.short;
                if (item.id === 'empty') colorBox.classList.add('border', 'border-gray-300');

                const nameLabel = document.createElement('span');
                nameLabel.className = 'text-[9px] text-center leading-tight font-bold text-gray-500 whitespace-nowrap overflow-hidden w-full';
                nameLabel.innerText = item.name;

                el.appendChild(colorBox);
                el.appendChild(nameLabel);
                containers[item.type].appendChild(el);
            });
        }

        function createAxisLabel(text) {
            const div = document.createElement('div');
            div.className = 'axis-label';
            div.innerText = text;
            return div;
        }

        /* 格子元素快取：熱路徑（畫筆預覽、景點指示、包圍警示、搜尋定位）原本每格都跑一次
           `document.querySelector('.tile[data-r=..][data-c=..]')`，屬性選擇器在 600+ 格的
           迴圈裡是主要卡頓來源。renderGrid 時一次記下所有格子的 DOM 參照，之後 O(1) 取用。 */
        let tileEls = [];
        function tileAt(r, c) { const row = tileEls[r]; return row ? (row[c] || null) : null; }

        function renderGrid() {
            const gridEl = document.getElementById('gameGrid');
            gridEl.innerHTML = '';
            tileEls = Array.from({ length: gridRows }, () => Array(gridCols).fill(null));
            // 行列數依目前地圖尺寸（CSS 類別裡的 24/26 只是預設值）
            gridEl.style.gridTemplateColumns = 'var(--axis) repeat(' + gridCols + ', var(--tile)) var(--axis)';
            gridEl.style.gridTemplateRows = 'var(--axis) repeat(' + gridRows + ', var(--tile)) var(--axis)';

            // --- TOP AXIS ROW (Y: 由 gridCols+1 遞減到 2) ---
            gridEl.appendChild(createAxisLabel('')); // Top-left corner
            for (let c = 0; c < gridCols; c++) {
                gridEl.appendChild(createAxisLabel(gridCols + 1 - c));
            }
            gridEl.appendChild(createAxisLabel('')); // Top-right corner

            // --- MAIN GRID ROWS (X: 2 起) ---
            for (let r = 0; r < gridRows; r++) {
                const currentX = r + 2;
                
                // Left Y-Axis (X index)
                gridEl.appendChild(createAxisLabel(currentX));

                // Map Tiles
                for (let c = 0; c < gridCols; c++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.dataset.r = r;
                    tile.dataset.c = c;
                    /* 刻意不設原生 title：座標已由座標軸標籤與左下 #coordHint 各講一次，
                       第三次會與即時出現的 .spot-tooltip 疊成同一次 hover 的兩個延遲不同的通道。 */

                    const contentSpan = document.createElement('span');
                    contentSpan.className = 'content-span relative z-10 pointer-events-none drop-shadow-sm';
                    tile.appendChild(contentSpan);
                    tileEls[r][c] = tile;
                    
                    tile.addEventListener('mousedown', (e) => {
                        if (e.button === 2) return; // 右鍵留給吸管
                        e.preventDefault();
                        pushHistory(); // 一次筆劃（含拖曳）記錄一步
                        const fp = getFootprint(currentTool);
                        if ((rectMode || e.shiftKey) && fp.w === 1 && fp.h === 1) {
                            rectStart = { r, c }; rectEnd = { r, c };
                            previewRect();
                            return;
                        }
                        isDrawing = (fp.w === 1 && fp.h === 1); // 多格建築不支援拖曳連放
                        applyTool(r, c);
                    });
                    tile.addEventListener('contextmenu', (e) => {
                        e.preventDefault(); // 右鍵吸管：選取此格的類型
                        const t = gridData[r][c].type;
                        selectTool(t);
                        savePrefs({ pickHint: 1 });  // 學會了就不用再提示
                        showSysMsg(t === 'empty' ? '吸管：已切換為清除模式' : `吸管：已選取「${items[t].name}」`);
                    });
                    tile.addEventListener('mouseenter', () => {
                        updateCoordHint(r, c);
                        if (rectStart) { rectEnd = { r, c }; previewRect(); return; }
                        previewFootprint(r, c);
                        if (isDrawing) applyTool(r, c);
                    });
                    tile.addEventListener('touchstart', (e) => {
                        // 兩指同時落下時這裡會先跑一次 → 交給 #mapContainer 的手勢處理
                        if (e.touches.length > 1 || suppressTouchDraw) return;
                        e.preventDefault();
                        touchState = { r, c, lastR: r, lastC: c, painted: false, longFired: false, cells: 0, t0: Date.now() };
                        updateCoordHint(r, c);
                        clearTimeout(longPressTimer);
                        longPressTimer = setTimeout(() => {
                            if (touchState && !touchState.painted) {
                                touchState.longFired = true; // 長按 = 吸管
                                const t = gridData[r][c].type;
                                selectTool(t);
                                showSysMsg(t === 'empty' ? '吸管：已切換為清除模式' : `吸管：已選取「${items[t].name}」`);
                            }
                        }, 500);
                    }, { passive: false });
                    
                    gridEl.appendChild(tile);
                }

                // Right Y-Axis
                gridEl.appendChild(createAxisLabel(currentX));
            }

            // --- BOTTOM AXIS ROW ---
            gridEl.appendChild(createAxisLabel('')); // Bottom-left corner
            for (let c = 0; c < gridCols; c++) {
                gridEl.appendChild(createAxisLabel(gridCols + 1 - c));
            }
            gridEl.appendChild(createAxisLabel('')); // Bottom-right corner

            // 全域監聽器只綁一次（renderGrid 會因尺寸切換被重複呼叫）
            if (window.__gridListenersBound) return;
            window.__gridListenersBound = true;
            document.addEventListener('mouseup', () => {
                if (rectStart && rectEnd) commitRect();
                isDrawing = false;
                flushCheckSpots();  // 拖曳期間累積的重算，放手時結算一次
            });
            document.getElementById('gameGrid').addEventListener('contextmenu', e => e.preventDefault());

            // 觸控：移動中依手指位置找格子（touchmove 不會觸發各格的 mouseenter）
            gridEl.addEventListener('touchmove', (e) => {
                // 雙指＝平移/縮放，第一指不能繼續畫（守衛只放在 touchstart 攔不住已開始的筆劃）
                if (e.touches.length > 1 || suppressTouchDraw) return;
                if (!touchState || touchState.longFired) return;
                e.preventDefault();
                const touch = e.touches[0];
                const hit = document.elementFromPoint(touch.clientX, touch.clientY);
                const tileEl = hit && hit.closest ? hit.closest('.tile') : null;
                if (!tileEl) return;
                const nr = +tileEl.dataset.r, nc = +tileEl.dataset.c;
                if (nr === touchState.lastR && nc === touchState.lastC && touchState.painted) return;
                const fp = getFootprint(currentTool);
                if (!touchState.painted) {
                    // 開始移動才上色（保留長按吸管的判定時間）
                    clearTimeout(longPressTimer);
                    pushHistory();
                    touchState.painted = true;
                    if (rectMode && fp.w === 1 && fp.h === 1) {
                        rectStart = { r: touchState.r, c: touchState.c };
                        rectEnd = { r: nr, c: nc };
                        previewRect();
                        touchState.lastR = nr; touchState.lastC = nc;
                        return;
                    }
                    isDrawing = (fp.w === 1 && fp.h === 1);
                    applyTool(touchState.r, touchState.c);
                    touchState.cells++;
                }
                if (rectStart) { rectEnd = { r: nr, c: nc }; previewRect(); }
                else if (isDrawing) { applyTool(nr, nc); touchState.cells++; }
                updateCoordHint(nr, nc);
                touchState.lastR = nr; touchState.lastC = nc;
            }, { passive: false });

            gridEl.addEventListener('touchend', (e) => {
                clearTimeout(longPressTimer);
                if (!touchState) return;
                // 雙指手勢中止過這一筆 → 不補畫（否則縮放完會多一格）
                if (!suppressTouchDraw && !touchState.painted && !touchState.longFired) {
                    // 單點 = 畫一格／放一棟
                    pushHistory();
                    applyTool(touchState.r, touchState.c);
                }
                if (rectStart && rectEnd) commitRect();
                isDrawing = false;
                flushCheckSpots();
                touchState = null;
            });
            // 來電／通知／手掌誤觸會發 touchcancel：不補畫那一格，但一定要把狀態收乾淨
            gridEl.addEventListener('touchcancel', () => {
                clearTimeout(longPressTimer);
                isDrawing = false;
                rectStart = rectEnd = null;
                document.querySelectorAll('.tile.rect-preview').forEach(t => t.classList.remove('rect-preview'));
                flushCheckSpots();
                touchState = null;
            });
            document.getElementById('mapContainer').addEventListener('mouseleave', () => {
                isDrawing = false;
                flushCheckSpots();  // 拖出地圖外也要結算，不然統計會停在拖曳前的狀態
                document.querySelectorAll('.tile.fp-preview').forEach(t => t.classList.remove('fp-preview'));
                document.querySelectorAll('.tile.fp-raze').forEach(t => t.classList.remove('fp-raze'));
                lastRazeBid = null;
            });
        }

        function selectTool(id) {
            document.querySelectorAll('.palette-item').forEach(el => el.classList.remove('active'));
            const selected = document.getElementById(`tool-${id}`);
            if (selected) selected.classList.add('active');
            currentTool = id;
            savePrefs({ tool: id });
            if (id !== lastToolTracked) { lastToolTracked = id; track('select_tool', { tool_id: id, category: (items[id] && items[id].type) || '' }); }
            if (id !== 'empty' && items[id] && !items[id].hidden) {
                const rec = (prefs.recent || []).filter(x => x !== id);
                rec.unshift(id);
                savePrefs({ recent: rec.slice(0, 8) });
                renderRecent();
            }
            // 狀態一律顯示在右下資訊卡，不再每次選取都跳提示訊息
            /* 順序很重要：先決定要不要進「定位模式」，再算建議框。
               反過來的話 updateSuggestions() 讀到的還是上一次的狀態，藍框會先畫上去。
               兩種模式刻意互斥：
                 點到**已擺過**的設施 → 定位模式（聚光燈＋座標晶片，不畫建議框）
                 點到**還沒擺**的設施 → 擺放模式（清掉聚光燈，畫建議框） */
            highlightSelected(id);
            updateToolHint(id, updateSuggestions());
        }

        /* 「這棟參與哪些景點」＝唯一回答「我為什麼要放這個」的地方。
           桌機：右下浮動卡。手機：同一份內容掛在建築面板標題列（收合態就帶負載：
           建築名＋參與幾個景點），點一下就地展開 —— 是搬位置，不是刪掉。 */
        function updateToolHint(id, res) {
            const el = document.getElementById('toolHint');
            const item = items[id];
            const hideBoth = () => {
                el.classList.add('hidden');
                setToolHintMobile('', '');
            };
            if (!item || id === 'empty') { hideBoth(); return; }
            // 定位模式整卡收起：它講的全是景點搭配，而定位模式的唯一問題是「這種蓋在哪」
            if (document.body.classList.contains('locating')) { hideBoth(); return; }
            const inGroup = g => (Array.isArray(g) ? g.includes(id) : g === id);
            const related = SPOTS.filter(s => s.req.some(inGroup));
            const fp = getFootprint(id);
            const sizeTxt = fp.w * fp.h > 1 ? `（占地 ${fp.w}×${fp.h}）` : '';
            let html = `<div class="font-black text-gray-800 mb-1">${item.name}${sizeTxt}</div>`;
            if (!related.length) {
                html += '<div class="text-gray-500">不參與任何人氣景點</div>';
            } else {
                html += related.map(s => {
                    const others = s.req.filter(g => !inGroup(g))
                        .map(g => (Array.isArray(g) ? g : [g]).map(x => items[x] ? items[x].name : x).join('/')).join('＋');
                    let status = '';
                    if (lastSpotStats.activeIds.has(s.id)) {
                        status = ' <span class="text-green-600 font-bold">✔ 已成立</span>';
                    } else if (res && res.hitSpots && res.hitSpots.has(s.name)) {
                        status = ' <span class="text-blue-600 font-bold">✔ 藍框可立即完成</span>';
                    } else if (res && res.count === 0 && res.near && res.near.has(s.name)) {
                        status = ` <span class="text-sky-600 font-bold">△ 放天藍框處，再補「${res.near.get(s.name)}」</span>`;
                    }
                    return `<div class="text-gray-600"><b class="text-gray-800">${s.name}</b>：搭配 ${others}${status}</div>`;
                }).join('');
            }
            if (isBuildingType(id)) {
                html += '<div class="text-gray-400 mt-1 border-t border-gray-100 pt-1">攻略要訣：設施緊貼集中、少留通道，學生接觸多、戀愛事件較易觸發；但至少一側要鄰接空地或走廊，被完全包圍會無法使用（紅框警告）。</div>';
            }
            el.innerHTML = html;
            el.classList.remove('hidden');
            const done = related.filter(s => lastSpotStats.activeIds.has(s.id)).length;
            const head = related.length
                ? `${item.name} · ${related.length} 個景點（${done} 已成立）`
                : `${item.name} · 不參與景點`;
            setToolHintMobile(head, html);
        }

        // 手機版的同一份資訊；展開狀態存在 body class 上，才不會一邊畫一邊自己開闔
        function setToolHintMobile(head, html) {
            const t = document.getElementById('thToggle'), b = document.getElementById('thBody');
            if (!t || !b) return;
            if (!head) {
                t.innerHTML = '<span class="text-gray-400">🧱 選一個建築</span>';
                b.innerHTML = '';
                b.classList.add('hidden');
                return;
            }
            const open = document.body.classList.contains('th-open');
            t.innerHTML = `<span class="truncate">${esc(head)}</span><span class="text-gray-400 shrink-0">${open ? '▾' : '▸'}</span>`;
            b.innerHTML = html;
            b.classList.toggle('hidden', !open);
        }

        // 自動斜坡（遊戲規則）：高低差相差一層的整條交界都是斜坡，斜坡位於「高的那格」，
        // 不能手動放置或移動。空地才會顯示為斜坡；相差兩層（平地貼高地2）則是懸崖、無斜坡。
        function isSlopeIn(g, r, c) {
            const cell = g[r][c];
            if (cell.type !== 'empty' || cell.elevation < 2) return false;
            return [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dr, dc]) => {
                const nr = r + dr, nc = c + dc;
                return nr >= 0 && nr < gridRows && nc >= 0 && nc < gridCols &&
                    g[nr][nc].elevation === cell.elevation - 1;
            });
        }
        function isSlope(r, c) { return isSlopeIn(gridData, r, c); }

        // 同一棟建築判定：同類型且同棟別編號（bid）。手繪的 1×1 地形沒有 bid、不合併。
        function sameBlockIn(g, r, c, nr, nc) {
            if (nr < 0 || nr >= gridRows || nc < 0 || nc >= gridCols) return false;
            const a = g[r][c], b = g[nr][nc];
            return a.type === b.type && a.bid !== undefined && a.bid === b.bid;
        }
        function sameBlock(r, c, nr, nc) { return sameBlockIn(gridData, r, c, nr, nc); }

        function updateTileVisuals(r, c) {
            const tileEl = tileAt(r, c);
            if (!tileEl) return;
            const tileData = gridData[r][c];
            const toolId = tileData.type;
            const item = items[toolId] || items['empty'];
            const contentSpan = tileEl.querySelector('.content-span');

            tileEl.classList.toggle('elevation-2', tileData.elevation === 2);
            tileEl.classList.toggle('elevation-3', tileData.elevation === 3);
            tileEl.classList.toggle('slope-tile', isSlope(r, c));

            if (toolId === 'empty') {
                tileEl.style.backgroundColor = '';
                tileEl.style.boxShadow = '';
                if(contentSpan) contentSpan.innerText = '';
            } else {
                tileEl.style.backgroundColor = item.color;
                // 同一棟建築的相鄰格：用同色陰影填滿格線縫隙，視覺上合併成一整塊
                const shadows = [];
                if (sameBlock(r, c, r, c + 1)) shadows.push(`1px 0 0 ${item.color}`);
                if (sameBlock(r, c, r, c - 1)) shadows.push(`-1px 0 0 ${item.color}`);
                if (sameBlock(r, c, r + 1, c)) shadows.push(`0 1px 0 ${item.color}`);
                if (sameBlock(r, c, r - 1, c)) shadows.push(`0 -1px 0 ${item.color}`);
                if (tileData.elevation === 2) shadows.push('inset -2px -2px 4px rgba(0,0,0,0.1)');
                if (tileData.elevation === 3) shadows.push('inset -3px -3px 5px rgba(0,0,0,0.2)');
                tileEl.style.boxShadow = shadows.join(', ');
                if(contentSpan) {
                    contentSpan.style.color = item.textCol || 'black';
                    // 標籤只顯示在整棟的左上角格
                    const corner = !(sameBlock(r, c, r - 1, c) || sameBlock(r, c, r, c - 1));
                    contentSpan.innerText = corner ? item.short : '';
                }
            }
        }

        function updateSpotIndicators(r, c, coreSet, areaSet) {
            const tileEl = tileAt(r, c);
            if (!tileEl) return;

            tileEl.querySelectorAll('.spot-indicators, .spot-tooltip, .spot-area-ov').forEach(n => n.remove());
            tileEl.classList.remove('ring-2', 'ring-yellow-400', 'ring-inset', 'z-10');

            /* 定位模式：只看「這一種設施蓋在哪」，景點標記一個都不畫。
               這裡是源頭 guard —— 上面的清除照跑（所以進入定位模式時舊標記會被抹掉），
               但不再產生新的。少了這道，任何一次編輯都會經 checkSpots() 把黃框畫回來。
               註：黃色核心環帶 z-10，而聚光燈白幕是 z-index:9 —— 它會浮在白幕之上
               完全不被壓暗，這正是先前「壓暗了卻還是看到滿圖景點」的原因。 */
            if (document.body.classList.contains('locating')) return;

            // 影響範圍：只上淡黃底色，不加框（降低視覺噪音）
            if (areaSet.size > 0 && coreSet.size === 0) {
                const ov = document.createElement('div');
                ov.className = 'spot-area-ov absolute inset-0 bg-yellow-300/30 pointer-events-none z-[3]';
                tileEl.appendChild(ov);
            }

            // 核心格（條件建築本身）：黃框＋圓點＋懸浮說明
            const spotSet = coreSet;
            if (spotSet.size > 0) {
                tileEl.classList.add('ring-2', 'ring-yellow-400', 'ring-inset', 'z-10');

                const indContainer = document.createElement('div');
                indContainer.className = 'spot-indicators absolute -top-1 -right-1 flex flex-wrap-reverse gap-0.5 justify-end w-[120%] pointer-events-none z-20';

                const tooltip = document.createElement('div');
                tooltip.className = 'spot-tooltip flex flex-col gap-1.5 text-left';
                
                spotSet.forEach(spotId => {
                    const spot = SPOTS.find(s => s.id === spotId);
                    const dot = document.createElement('div');
                    dot.className = `w-2 h-2 rounded-full border border-white shadow-sm ${spot.dotColor}`;
                    indContainer.appendChild(dot);

                    // Map requirement building names for display（OR 條件顯示為「甲/乙」）
                    const reqNames = spot.req.map(g => (Array.isArray(g) ? g : [g])
                        .map(id => items[id] ? items[id].name : id).join('/')).join(' + ');

                    const tooltipItem = document.createElement('div');
                    tooltipItem.className = 'flex flex-col border-b border-gray-100 last:border-0 pb-1 last:pb-0';
                    tooltipItem.innerHTML = `
                        <div class="flex justify-between items-center gap-2">
                            <span class="text-[10px] font-black flex items-center gap-1 text-gray-800">
                                <div class="w-1.5 h-1.5 rounded-full ${spot.dotColor}"></div>
                                ${spot.name}<span class="text-gray-400 font-normal">（${SPOT_JP[spot.id] || ''}）</span>
                            </span>
                            <span class="bg-yellow-100 text-yellow-800 px-1 py-0.5 rounded text-[8px] font-bold">${spot.bonus}</span>
                        </div>
                        <span class="text-[9px] text-gray-500 mt-0.5">條件：${reqNames}</span>
                        ${spot.teacher ? `<span class="text-[9px] text-purple-500 mt-0.5">招募教師：${spot.teacher}</span>` : ''}
                    `;
                    tooltip.appendChild(tooltipItem);
                });
                
                tileEl.appendChild(indContainer);
                tileEl.appendChild(tooltip);
            }
        }

        // 可通行地形（供「設施是否被包圍」判定用）：空地、草地、走廊、道路、水泥地、斜面
        const PASSABLE = new Set(['empty', 'grass', 'wood_path', 'asphalt', 'concrete', 'slope']);
        function isBuildingType(t) {
            const it = items[t];
            return !!it && (it.type === 'fac' || it.type === 'spec' || it.type === 'sports' || it.type === 'farm');
        }

        // ─── 動線可達性：從校門 BFS ───
        // 跨格規則：同高度可走；高低差 1 且「高的那格」是斜坡可走；懸崖（差 2 層或無斜坡）不可走。
        function canStep(g, r, c, nr, nc) {
            const a = g[r][c], b = g[nr][nc];
            if (a.elevation === b.elevation) return true;
            if (Math.abs(a.elevation - b.elevation) !== 1) return false;
            const hi = a.elevation > b.elevation ? [r, c] : [nr, nc];
            return isSlopeIn(g, hi[0], hi[1]);
        }

        // 回傳步行距離矩陣（-1 = 不可達或非通行地形）；地圖上沒有校門時回傳 null
        function computeReachability() {
            const dist = Array(gridRows).fill(null).map(() => Array(gridCols).fill(-1));
            const queue = [];
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    const t = gridData[r][c].type;
                    if (t === 'gate' || t === 'gate_h') { dist[r][c] = 0; queue.push([r, c]); }
                }
            }
            if (!queue.length) return null;
            let head = 0;
            while (head < queue.length) {
                const [r, c] = queue[head++];
                for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
                    const nr = r + dr, nc = c + dc;
                    if (nr < 0 || nr >= gridRows || nc < 0 || nc >= gridCols) continue;
                    if (dist[nr][nc] !== -1) continue;
                    if (!PASSABLE.has(gridData[nr][nc].type)) continue;
                    if (!canStep(gridData, r, c, nr, nc)) continue;
                    dist[nr][nc] = dist[r][c] + 1;
                    queue.push([nr, nc]);
                }
            }
            return dist;
        }

        function styleFlowBtn() {
            const b = document.getElementById('flowBtn');
            if (!b) return;
            b.classList.toggle('bg-indigo-600', !!prefs.flowOn);
            b.classList.toggle('text-white', !!prefs.flowOn);
        }

        // 動線圖層開關（頂列的 👣 與常駐摘要的「⚠ N 棟走不到」共用）。
        // 實際的互斥／落地交給 setMapLayer()——動線與差異不能同時開（見那支的註解）。
        function toggleFlow(forceOn) {
            const want = forceOn === undefined ? !prefs.flowOn : !!forceOn;
            if (want && !lastHasGate) { showSysMsg('地圖上沒有校門，無法計算動線', true); return false; }
            if (want === !!prefs.flowOn) return true;
            const hadDiff = !!prefs.diffOn;
            if (!setMapLayer(want ? 'flow' : null)) return false;
            track('toggle_flow', { on: want });
            showSysMsg(want
                ? '動線圖層：綠＝離校門近、紅＝遠、灰斜紋＝走不到' + (hadDiff ? '（差異圖層已關閉）' : '')
                : '已關閉動線圖層');
            return true;
        }

        // 動線圖層：可達的通行格上距離色階（近綠遠紅）、走不到的通行格灰斜紋
        function updateFlowOverlay() {
            document.querySelectorAll('.flow-ov').forEach(n => n.remove());
            if (!prefs.flowOn) return;
            const dist = computeReachability();
            if (!dist) return; // 沒校門：不畫（toggle 時已提示）
            let maxD = 1;
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) maxD = Math.max(maxD, dist[r][c]);
            }
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    if (!PASSABLE.has(gridData[r][c].type)) continue;
                    const el = tileAt(r, c);
                    if (!el) continue;
                    const ov = document.createElement('div');
                    ov.className = 'flow-ov absolute inset-0 pointer-events-none z-[2]';
                    if (dist[r][c] >= 0) {
                        const hue = 120 - Math.round(120 * (dist[r][c] / maxD));
                        ov.style.background = `hsla(${hue}, 85%, 45%, 0.3)`;
                    } else {
                        ov.style.background = 'repeating-linear-gradient(45deg, rgba(107,114,128,0.45) 0 3px, transparent 3px 7px)';
                    }
                    el.appendChild(ov);
                }
            }
        }

        // 攻略規則：設施四周被建築完全包圍時，學生進不去、等於白蓋 → 整棟加紅框警告。
        // 同類型相連的格子視為同一棟；地圖上有校門時，出入口必須鄰接「從校門可達」的格子
        //（孤島上的設施也會被抓出來），沒有校門則退回「鄰接可通行地形」的判定。
        function updateAccessWarnings() {
            document.querySelectorAll('.tile.blocked').forEach(t => t.classList.remove('blocked'));
            let blockedCount = 0;
            const reach = computeReachability();
            // 常駐摘要要用「有沒有校門」與「第一棟走不到的位置」，在這裡順手記下來
            // （BFS 很貴，不讓摘要自己再算一次）
            lastHasGate = !!reach;
            lastBlockedFirst = null;
            lastBuildingGroups = 0;
            const seen = Array(gridRows).fill(null).map(() => Array(gridCols).fill(false));
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    if (seen[r][c] || !isBuildingType(gridData[r][c].type)) continue;
                    lastBuildingGroups++;
                    const type = gridData[r][c].type;
                    const cells = [];
                    const stack = [[r, c]];
                    seen[r][c] = true;
                    let hasAccess = false;
                    while (stack.length) {
                        const [cr, cc] = stack.pop();
                        cells.push([cr, cc]);
                        [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dr, dc]) => {
                            const nr = cr + dr, nc = cc + dc;
                            if (nr < 0 || nr >= gridRows || nc < 0 || nc >= gridCols) return;
                            const nt = gridData[nr][nc].type;
                            if (nt === type && !seen[nr][nc]) { seen[nr][nc] = true; stack.push([nr, nc]); }
                            else if (PASSABLE.has(nt) && (!reach || reach[nr][nc] >= 0)) hasAccess = true;
                        });
                    }
                    if (!hasAccess) {
                        blockedCount++;
                        if (!lastBlockedFirst) lastBlockedFirst = [r, c];
                        cells.forEach(([br, bc]) => {
                            const el = tileAt(br, bc);
                            if (el) el.classList.add('blocked');
                        });
                    }
                }
            }
            lastBlockedCount = blockedCount;
        }

        // req 條件判定：每一項可以是單一 id 或「其中一種即可」的陣列
        function reqSatisfied(req, typeSet) {
            return req.every(g => (Array.isArray(g) ? g : [g]).some(t => typeSet.has(t)));
        }

        // 官方規則（攻略 Wiki）：三種條件建築同時「碰到」任一 4×4 視窗即成立景點，
        // 大建築只要一部分進入視窗就算。成立後，視窗內的條件建築格與其周圍一圈
        //（占地 4 格以上的大建築為兩圈）被指定為景點範圍。
        function checkSpots() {
            const coreGrid = Array(gridRows).fill(null).map(() => Array(gridCols).fill(null).map(() => new Set()));
            const areaGrid = Array(gridRows).fill(null).map(() => Array(gridCols).fill(null).map(() => new Set()));
            const activeIds = new Set();
            const nearMap = new Map(); // 只差一項的景點 id → 缺的設施名集合

            for (let wr = 0; wr <= gridRows - 4; wr++) {
                for (let wc = 0; wc <= gridCols - 4; wc++) {
                    const typesIn = new Set();
                    for (let dr = 0; dr < 4; dr++) {
                        for (let dc = 0; dc < 4; dc++) {
                            const t = gridData[wr + dr][wc + dc].type;
                            if (t !== 'empty') typesIn.add(t);
                            else if (isSlope(wr + dr, wc + dc)) typesIn.add('slope');
                        }
                    }
                    if (!typesIn.size) continue;

                    SPOTS.forEach(spot => {
                        const unmet = spot.req.filter(g => !(Array.isArray(g) ? g : [g]).some(t => typesIn.has(t)));
                        if (unmet.length === 1) {
                            // 只差一項 → 進統計面板的「差一項就成立」清單（記名稱與可點選的設施 id）
                            const g = Array.isArray(unmet[0]) ? unmet[0] : [unmet[0]];
                            const nm = g.map(t => items[t] ? items[t].name : t).join('/');
                            if (!nearMap.has(spot.id)) nearMap.set(spot.id, new Map());
                            nearMap.get(spot.id).set(nm, g[0]);
                            return;
                        }
                        if (unmet.length > 0) return;
                        activeIds.add(spot.id);
                        const reqTypes = spot.req.flat();
                        for (let dr = 0; dr < 4; dr++) {
                            for (let dc = 0; dc < 4; dc++) {
                                const nr = wr + dr, nc = wc + dc;
                                const rawT = gridData[nr][nc].type;
                                const t = rawT === 'empty' && isSlope(nr, nc) ? 'slope' : rawT;
                                if (!reqTypes.includes(t)) continue;
                                coreGrid[nr][nc].add(spot.id);
                                const it = items[t];
                                const ring = it && ((it.w || 1) * (it.h || 1) >= 4) ? 2 : 1;
                                for (let rr = -ring; rr <= ring; rr++) {
                                    for (let rc = -ring; rc <= ring; rc++) {
                                        const mr = nr + rr, mc = nc + rc;
                                        if (mr >= 0 && mr < gridRows && mc >= 0 && mc < gridCols) {
                                            areaGrid[mr][mc].add(spot.id);
                                        }
                                    }
                                }
                            }
                        }
                    });
                }
            }

            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) {
                    updateSpotIndicators(r, c, coreGrid[r][c], areaGrid[r][c]);
                }
            }
            lastSpotStats = { activeIds, nearMap };
            // 順序：先算動線（會更新 lastHasGate／lastBlockedCount），摘要才不會慢一步
            updateAccessWarnings();
            renderSpotStats(activeIds, nearMap);
            updateFlowOverlay();
            updateToolHint(currentTool, updateSuggestions());
            if (hlIds) applyHighlight();  // 地圖變動後重新套用定位（維持目前的命中集合，不退回模糊比對）
            // 差異要跟著每一筆編輯走（這就是「邊改邊看」的意思）；它自己會處理
            // 「定位中暫停」與「沒有可比基準」兩種退化狀態，並更新右軌那兩列文案。
            renderDiffOverlay();
            scheduleAutosave();
        }

        // ─── 共用 modal 外殼（景點明細／發展建議／手冊／比較）───
        // 「📋 佈局體檢」已刪除：它與景點總覽重複，晶片還不可點；獨有的屬性加成合計與
        // 使用格數搬進 buildSpotDetail()（＝點「N/29」就看得到）。
        let reportOpener = null;
        function openReport(title, html) {
            reportOpener = document.activeElement;
            document.getElementById('reportTitle').innerText = title;
            document.getElementById('reportBody').innerHTML = html;
            document.getElementById('reportModal').classList.remove('hidden');
            document.getElementById('reportCloseBtn').focus();
        }
        function closeReport() {
            document.getElementById('reportModal').classList.add('hidden');
            if (reportOpener && reportOpener.focus) { try { reportOpener.focus(); } catch (e) {} }
            reportOpener = null;
        }

        // ─── 發展建議：依攻略 Wiki 的設施解鎖條件，按遊戲進度分階段整理 ───
        // needs 為「前置設施×N」條件，會自動對照地圖上已建數量；其餘條件是遊戲內狀態，僅供對照。
        const DEV_GUIDE = [
            { stage: '開局初期（農村學園）', items: [
                { id: 'board', cond: '一開始就可建' },
                { id: 'well', cond: '一開始就可建' },
                { id: 'water', cond: '一開始就可建' },
                { id: 'toilet', cond: '學生 4 人' },
                { id: 'incinerator', cond: '學生 5 人' },
                { id: 'nurse', cond: '學生 5 人' },
                { id: 'tea_room', cond: '學生 5 人' },
                { id: 'broadcast', cond: '學生 7 人' },
                { id: 'library', cond: '學生 7 人' }
            ]},
            { stage: '發展學園（升級條件：學生 5 人）', items: [
                { id: 'bench', cond: '升上發展學園' },
                { id: 'locker', cond: '1 年 6 月（時間到解鎖）' },
                { id: 'shop', cond: '發展學園＋學生 10 人' },
                { id: 'vending', cond: '福利社×1', needs: { shop: 1 } },
                { id: 'tennis', cond: '發展學園＋運動 40' },
                { id: 'field', cond: '發展學園＋運動 50' },
                { id: 'multi_room', cond: '學生 16 人' },
                { id: 'home_ec', cond: '頭腦 80' },
                { id: 'music', cond: '發展學園＋頭腦 90' },
                { id: 'trampoline', cond: '飲水處×2', needs: { water: 2 } },
                { id: 'weather', cond: '小農場×2', needs: { farm: 2 } },
                { id: 'basketball', cond: '網球場×1＋運動 60', needs: { tennis: 1 } }
            ]},
            { stage: '有望學園（升級條件：學生 14＋景點 1 種＋第 2 年）', items: [
                { id: 'av_room', cond: '升上有望學園' },
                { id: 'game_corner', cond: '升上有望學園' },
                { id: 'science', cond: '有望學園＋頭腦 90' },
                { id: 'art', cond: '音樂室×1＋頭腦 90', needs: { music: 1 } },
                { id: 'cafeteria', cond: '有望學園＋態度 75' },
                { id: 'computer', cond: '有望學園＋理科室×1', needs: { science: 1 } },
                { id: 'gym', cond: '有望學園＋電腦室×1＋頭腦 95', needs: { computer: 1 } },
                { id: 'baseball', cond: '網球場×2＋運動 80', needs: { tennis: 2 } },
                { id: 'soccer', cond: '棒球場×1＋運動 105', needs: { baseball: 1 } },
                { id: 'dojo', cond: '體育館×2', needs: { gym: 2 } },
                { id: 'convenience', cond: '超大型學校（學生 18＋景點 3 種＋第 4 年＋平均 300 分）' }
            ]},
            { stage: '名門學園（升級條件：學生 20＋景點 6 種＋第 6 年＋平均 400 分）', items: [
                { id: 'planetarium', cond: '名門學園＋太空人 1 人' },
                { id: 'pool', cond: '名門學園＋運動 110＋體育館', needs: { gym: 1 } }
            ]}
        ];

        // 地圖上某設施的「棟數」：多格建築算棟別數，1×1 算格數
        function countBuilt(id) {
            const it = items[id];
            if (!it) return 0;
            const w = it.w || 1, h = it.h || 1;
            if (w * h > 1) {
                const bids = new Set();
                let cells = 0;
                for (let r = 0; r < gridRows; r++) {
                    for (let c = 0; c < gridCols; c++) {
                        if (gridData[r][c].type === id) { cells++; if (gridData[r][c].bid) bids.add(gridData[r][c].bid); }
                    }
                }
                return bids.size || Math.floor(cells / (w * h));
            }
            let n = 0;
            for (let r = 0; r < gridRows; r++) {
                for (let c = 0; c < gridCols; c++) if (gridData[r][c].type === id) n++;
            }
            return n;
        }

        function buildDevGuide() {
            let html = '<div class="text-[11px] text-gray-400 mb-2">依攻略 Wiki 的解鎖條件整理。「學園等級／學生數／屬性」是遊戲內狀態，請對照你目前的進度；「前置設施×N」會自動核對地圖上的數量。✅已建　⬜可規劃　🔒前置未滿足</div>';
            DEV_GUIDE.forEach(stage => {
                html += `<div class="font-black text-gray-800 mt-2 mb-1">◆ ${stage.stage}</div>`;
                html += stage.items.map(entry => {
                    const it = items[entry.id];
                    const built = countBuilt(entry.id);
                    let needTxt = '';
                    let ready = true;
                    if (entry.needs) {
                        needTxt = Object.entries(entry.needs).map(([nid, cnt]) => {
                            const have = countBuilt(nid);
                            if (have < cnt) ready = false;
                            return `${items[nid].name}×${cnt}（地圖現有 ${have}）`;
                        }).join('、');
                    }
                    const icon = built > 0 ? '✅' : (entry.needs && !ready ? '🔒' : '⬜');
                    let line = `${icon} <b>${it.name}</b>`;
                    if (built > 0) line += `<span class="text-green-600">（已建 ${built}）</span>`;
                    line += `<span class="text-gray-400">　${entry.cond}</span>`;
                    if (entry.needs && !ready) line += `<br><span class="text-sky-600 ml-4">→ 先補齊：${needTxt}</span>`;
                    return `<div class="text-gray-600">${line}</div>`;
                }).join('');
            });
            openReport('📈 發展建議', html);
        }

        /* ─── 速查表（景點／設施／中日對照）─────────────────────────────
           資料**一律讀 `db/data.js` 的 window.GAME_DB**（正本）。這裡曾經有一份 180 行的
           手寫副本（攻略要點／學園規模／教師／社團／進路／行事／授業／挑戰／道具／學生），
           它已經漂移過一次——而漂移的後果是「同一個螢幕上兩個互相矛盾的答案」，比兩個頁面
           不一致嚴重一級，所以整份刪掉。

           只留三張表的判準：**留在畫布旁邊的表，必須知道畫布的狀態。**
             景點 → 每列標「已成立 ✔／差一項：缺 ○○」，表頭再壓一條升級門檻條（N/29 的分母）
             設施 → 每列標「已建 N」，並預設按尺寸排序（「右邊只剩 3 格寬，有什麼放得下」）
